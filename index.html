<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classroom Hub">
<title>Classroom Hub</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#1d2b28;--mut:#66787a;--pri:#1f6f5c;--pri2:#e2f2ed;--pri3:#a9d5c7;--line:#d9e4e1;--soft:#f0f6f4;--red:#c94545;--amb:#d98a00;--blu:#2f6fd0;--grn:#2e9e6b;--r:12px}
:root[data-theme=blue]{--bg:#f2f6fc;--pri:#2563b8;--pri2:#e3edfb;--pri3:#a9c4ee;--line:#d6e0f0;--soft:#edf3fb;--mut:#62718a}
:root[data-theme=pink]{--bg:#fff5f9;--pri:#d6336c;--pri2:#fde4ee;--pri3:#f4a9c5;--line:#f3d4e0;--soft:#fdeef4;--mut:#8a6574}
:root[data-theme=red]{--bg:#fff6f5;--pri:#c0392b;--pri2:#fbe4e1;--pri3:#efb0a8;--line:#f0d3cf;--soft:#fdeeec;--mut:#86655f}
:root[data-theme=purple]{--bg:#f7f4fc;--pri:#6f42c1;--pri2:#ece4f8;--pri3:#c9b5ea;--line:#e0d6f0;--soft:#f2edfa;--mut:#71678a}
:root[data-theme=orange]{--bg:#fff8f1;--pri:#b85c00;--pri2:#fdebd6;--pri3:#f0c595;--line:#f2dfc8;--soft:#fdf1e3;--mut:#85705a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding-top:env(safe-area-inset-top)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;max-width:1100px;margin:0 auto}
.brand{font-weight:700;white-space:nowrap}
#clsSel{flex:1;min-width:0;background:#fff;border:0;border-radius:8px;padding:8px;color:var(--ink)}
.ib{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:0 0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 8px 6px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.85);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:var(--pri);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:1rem;margin:12px 0 6px}
.muted{color:var(--mut);font-size:.9rem;margin:4px 0}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row.wrap{flex-wrap:wrap}
.rowsp{display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;min-height:44px;width:100%}
.row input[type=text]{flex:1}
select{width:auto;max-width:100%}
textarea{resize:vertical}
input[type=number]{width:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{color:var(--red);border-color:#efc3c3}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.9rem}
.btn.big{width:100%;min-height:56px;font-size:1.15rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px 2px;font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.95rem}
.chk input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.chip.s{padding:2px 10px;min-height:32px;font-size:.85rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.A.on{background:var(--red);border-color:var(--red)}
.chip.L.on{background:var(--amb);border-color:var(--amb)}
.chip.E.on{background:var(--blu);border-color:var(--blu)}
.chip.P.on{background:var(--grn);border-color:var(--grn)}
.chip.T-activity.on{background:#2e9e6b;border-color:#2e9e6b}
.chip.T-quiz.on{background:#2f6fd0;border-color:#2f6fd0}
.chip.T-peta.on{background:#7b4fc4;border-color:#7b4fc4}
.chip.T-summative.on{background:#b86e00;border-color:#b86e00}
.chip.T-exam.on{background:#c0392b;border-color:#c0392b}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-2px}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.slist li:last-child{border:0}
.ln{width:28px;color:var(--mut);text-align:right;font-size:.85rem}
.lname{flex:1;text-align:left;background:none;border:0;padding:10px 6px;cursor:pointer}
.x{background:none;border:0;color:var(--red);font-size:22px;width:44px;height:44px;cursor:pointer}
.x.s{width:28px;height:28px;font-size:18px}
/* seat plan */
.gridwrap{overflow-x:auto;padding-bottom:4px}
.front{text-align:center;font-size:.75rem;letter-spacing:.15em;color:var(--mut);background:var(--soft);border-radius:6px;padding:4px;margin-bottom:8px}
.grid{display:grid;gap:6px;--seatbg:#fff;--seatbd:var(--line)}
.grid[data-seat=theme]{--seatbg:var(--pri2);--seatbd:var(--pri3)}
.grid[data-seat=sky]{--seatbg:#dcecff;--seatbd:#9cc2f5}
.grid[data-seat=mint]{--seatbg:#dff5e8;--seatbd:#98d6b2}
.grid[data-seat=sun]{--seatbg:#fff3c4;--seatbd:#f0d77a}
.grid[data-seat=rose]{--seatbg:#ffe0ea;--seatbd:#f2a9c1}
.grid[data-seat=lilac]{--seatbg:#ebe0fb;--seatbd:#c3aaf0}
.grid[data-seat=peach]{--seatbg:#ffe6d2;--seatbd:#f3bb92}
.seat.rw0{--seatbg:#dcecff;--seatbd:#9cc2f5}
.seat.rw1{--seatbg:#dff5e8;--seatbd:#98d6b2}
.seat.rw2{--seatbg:#fff3c4;--seatbd:#f0d77a}
.seat.rw3{--seatbg:#ffe0ea;--seatbd:#f2a9c1}
.seat{position:relative;min-height:62px;border:2px solid var(--seatbd);border-radius:10px;background:var(--seatbg);padding:4px 3px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.75rem;line-height:1.15;cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none}
.seat.ni{cursor:default}
.seat.empty{background:var(--soft);border:2px dashed var(--line)}
.seat .nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-weight:600}
.grid.dense .seat{font-size:.65rem}
.seat .idx{color:#b3c1be;font-size:.7rem}
.seat.sel{border-color:var(--pri);background:#fff7c2;box-shadow:0 0 0 3px var(--pri)}
.seat.dragging{opacity:.4}
.seat.hb{padding-top:15px}
.seat.over,.gm.over,.gcard.over{outline:3px dashed var(--pri);outline-offset:1px}
.aisle-v{justify-self:center;width:4px;height:100%;background:repeating-linear-gradient(0deg,var(--pri3) 0 6px,transparent 6px 12px)}
.aisle-h{grid-column:1/-1;height:16px;background:repeating-linear-gradient(90deg,var(--pri3) 0 8px,transparent 8px 16px) center/100% 4px no-repeat}
.bdg{position:absolute;top:2px;right:2px;min-width:20px;padding:0 5px;border-radius:999px;font-size:.7rem;font-weight:700;text-align:center;line-height:18px}
.bdg.pts{background:#ffe9a8;color:#6b4b00}
.bdg.pts.neg{background:#fbd0d0;color:#8a1f1f}
.bdg.stt{left:2px;right:auto;background:#1d2b28;color:#fff}
.seat.st-P{background:#e3f6ec;border-color:var(--grn)}
.seat.st-A{background:#fde4e4;border-color:var(--red)}
.seat.st-L{background:#fff1d6;border-color:var(--amb)}
.seat.st-E{background:#e1ecff;border-color:var(--blu)}
/* picker */
.stage{min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.6rem,7vw,2.8rem);font-weight:800;background:linear-gradient(135deg,var(--pri2),#fff7dc);border-radius:var(--r);padding:16px;margin-bottom:10px;word-break:break-word}
.stage.spin{color:var(--mut)}
/* groups */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.gcard{border:2px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;color:#fff}
.ghead b{flex:1;min-width:90px;word-break:break-word}
.ghead .cnt{font-weight:400;opacity:.85;font-size:.85rem}
.gh{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:8px;min-width:30px;height:30px;cursor:pointer;font-weight:700}
.gs{font-weight:700;white-space:nowrap}
.gbody{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.gm{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fafcfb;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px;text-align:left;user-select:none;-webkit-user-select:none}
.gm .gn{color:var(--mut);font-size:.8rem;min-width:18px}
.gm.sel{border-color:var(--pri);background:#fff7c2;box-shadow:0 0 0 2px var(--pri)}
.gm.dragging{opacity:.4}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:28px;text-align:center;font-size:1.2rem}
/* tags & tasks */
.tg{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700;color:#fff;margin:2px 4px 2px 0}
.tg-activity{background:#2e9e6b}.tg-quiz{background:#2f6fd0}.tg-peta{background:#7b4fc4}.tg-summative{background:#b86e00}.tg-exam{background:#c0392b}
.tgw{display:inline-flex;align-items:center;margin-right:6px}
.tagbox{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
.mrow{border-bottom:1px solid var(--line);padding:8px 0}
.mrow:last-child{border:0}
.mname{font-weight:700}
.mp{border:2px solid #efc3c3;border-left-width:6px;background:#fde4e4;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.85rem;margin:3px 4px 3px 0}
.mp.tp-activity{border-left-color:#2e9e6b}.mp.tp-quiz{border-left-color:#2f6fd0}.mp.tp-peta{border-left-color:#7b4fc4}.mp.tp-summative{border-left-color:#b86e00}.mp.tp-exam{border-left-color:#c0392b}
.mp.done{background:#e3f6ec;border-color:#98d6b2;text-decoration:line-through;color:#2a6b4a}
.mpw{display:inline-flex;align-items:center}
.mx{background:none;border:0;cursor:pointer;color:var(--red);font-size:16px;padding:0 6px 0 0;margin-right:4px}
.tk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
/* summary table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
th{background:var(--soft);position:sticky;top:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stat{flex:1;min-width:84px;background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.stat.A b{color:var(--red)}.stat.L b{color:var(--amb)}.stat.E b{color:var(--blu)}.stat.P b{color:var(--grn)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;margin:2px 4px 2px 0;background:var(--soft)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,28,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.mbox label.lb{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
.mbox select{width:100%}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:600}
.tbtn.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.tsw{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
/* sync badge */
.ib{position:relative}
.ib[data-s]::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--pri);background:#9aa5a3}
.ib[data-s="ok"]::after{background:#4ade80}
.ib[data-s="pending"]::after,.ib[data-s="busy"]::after{background:#fbbf24}
.ib[data-s="needs"]::after,.ib[data-s="err"]::after,.ib[data-s="mismatch"]::after{background:#f87171}
.ssts{border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--pri3);font-size:.92rem}
.ssts.bad{background:#fde4e1;color:#7a1f14}
/* landscape / full-screen seat view */
#fs[hidden]{display:none}
body.fsmode .top,body.fsmode main{display:none}
.fs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:8px;gap:6px;touch-action:manipulation;overflow:hidden}
.fs.rot{width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
.fs-bar{display:flex;align-items:center;gap:8px;height:38px;flex:0 0 auto}
.fs-front{flex:1;text-align:center;font-size:.75rem;letter-spacing:.15em;color:var(--mut);background:var(--soft);border-radius:6px;padding:8px 4px}
.fs-btn{background:var(--pri);color:#fff;border:0;border-radius:8px;height:36px;padding:0 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.fs-grid{flex:1;min-height:0}
.fs-chip{background:#fff;color:var(--pri);border:2px solid var(--pri);border-radius:999px;height:36px;min-width:38px;padding:0 10px;font-weight:800;font-size:1rem;cursor:pointer;flex:0 0 auto}
.fs-chip.on{background:var(--pri);color:#fff}
.fs-btn:disabled{opacity:.4}
.fs-front{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-front b{color:var(--ink,#1d2b28);letter-spacing:0;font-size:.95rem}
button.seat{font-family:inherit;color:inherit}
.fs button.seat{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fs .seat.pop{animation:fspop .35s ease-out}
@keyframes fspop{0%{transform:scale(1)}35%{transform:scale(1.09);box-shadow:0 0 0 4px var(--pri)}100%{transform:scale(1)}}
body.fsmode #toast{z-index:70}
.fs .seat{min-height:0;height:100%;font-size:var(--fsz,14px);flex-direction:column;gap:3px;padding:2px 3px;border-radius:10px}
.fs .seat .nm{font-size:1em;line-height:1.15;-webkit-line-clamp:2}
.fs .sc{font-size:.9em;font-weight:800;background:#ffe9a8;color:#6b4b00;border-radius:999px;padding:0 .55em;line-height:1.4;white-space:nowrap}
.fs .sc.neg{background:#fbd0d0;color:#8a1f1f}
.fs .sc.z{background:rgba(0,0,0,.07);color:var(--mut);font-weight:600}
.fs .aisle-h{height:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d2b28;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.brand span:not(.bi){display:none}.seat{font-size:.66rem;padding:3px 2px;min-height:58px;border-radius:8px}.grid{gap:4px}.bdg{font-size:.6rem;min-width:16px;padding:0 3px;line-height:15px}.card{padding:12px}main{padding:10px}}

:root{--sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"DM Serif Display","Georgia",serif;--glow:31,111,92}
html{font-size:15px}
html[data-fs=s]{font-size:14px}
html[data-fs=l]{font-size:16.5px}
body{font:1rem/1.45 var(--sans)}
button,input,select,textarea{font-family:var(--sans)}
h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
h2{font-size:1.25rem}h3{font-size:1.1rem}
.brand{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.muted{font-size:.85rem}
.stat b,.stage,.stepper b{font-family:var(--serif);font-weight:400}
.stat b{font-size:1.6rem}
.stage{font-size:clamp(1.7rem,7vw,2.9rem)}
.tab{font-weight:600;font-size:.95rem}
.seat{font-size:.8rem}
.seat .nm{font-weight:700}
.grid.dense .seat{font-size:.7rem}

/* ---- cute themes ---- */
html[data-cute]{--r:20px}
html[data-cute] body{background:var(--bg) var(--pat) 0 0/84px 84px}
html[data-cute] .top{box-shadow:0 6px 14px -6px rgba(var(--glow),.55)}
html[data-cute] .top::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 10px 0,var(--pri) 9px,transparent 10.5px) 0 0/20px 10px repeat-x;pointer-events:none}
html[data-cute] main{padding-top:22px}
html[data-cute] .card{position:relative;border:2px solid var(--line);padding:18px;box-shadow:0 8px 18px -12px rgba(var(--glow),.6)}
html[data-cute] .card::before{content:"";position:absolute;inset:5px;border:1.5px dashed var(--pri3);border-radius:calc(var(--r) - 5px);opacity:.6;pointer-events:none}
html[data-cute] .btn{border-radius:999px;border-width:2px}
html[data-cute] .btn.pri{box-shadow:0 5px 12px -5px rgba(var(--glow),.8)}
html[data-cute] .ib{border-radius:50%;background:rgba(255,255,255,.28)}
html[data-cute] #clsSel{border-radius:999px;padding:8px 12px;font-weight:700}
html[data-cute] input[type=text],html[data-cute] input[type=number],html[data-cute] input[type=date],html[data-cute] select,html[data-cute] textarea{border-radius:14px;border-width:2px}
html[data-cute] .seat{border-radius:16px;border-width:2px}
html[data-cute] .stat{border-radius:18px}
html[data-cute] .stage{border-radius:22px}
html[data-cute] .mbox{border-radius:26px;border:2px solid var(--pri3)}
html[data-cute] .bdg.pts::before{content:var(--pe) " "}
html[data-cute] .tab.on{box-shadow:0 3px 8px -3px rgba(var(--glow),.6)}
.hello{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--pri2),#fff 85%)}
.mas{flex:0 0 auto;width:68px;height:68px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:bob 3.2s ease-in-out infinite}
.mas svg{width:100%;height:100%;display:block;overflow:visible}
.mas.jump{animation:jump .6s ease-out}
.bub{position:relative;background:#fff;border:2px solid var(--pri3);border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.bub::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:#fff;border-left:2px solid var(--pri3);border-bottom:2px solid var(--pri3);transform:translateY(-50%) rotate(45deg)}
.bub b{font-family:var(--serif);font-weight:400;font-size:1.1rem;color:var(--pri)}
.bub span{font-size:.85rem;color:var(--mut)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.08,.94)}60%{transform:translateY(0) scale(.94,1.06)}100%{transform:none}}
.spk{position:fixed;bottom:38vh;z-index:90;pointer-events:none;font-size:22px;animation:spk 1.1s ease-out forwards}
@keyframes spk{0%{opacity:0;transform:translate(0,10px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.25)}}
.sec{font-size:.8rem;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
.tbtn .mini{width:48px;height:48px}
.tbtn .mini svg{width:100%;height:100%}
.fsz{display:flex;gap:6px;margin:6px 0}
.fsz .chip{flex:1;text-align:center}
@media (max-width:520px){.seat{font-size:.72rem}.grid.dense .seat{font-size:.62rem}}
@media (prefers-reduced-motion:reduce){.mas,.mas.jump,.spk{animation:none}}
html .front.bot{margin:8px 0 0}
.fs-front.tl{background:none;text-align:left;letter-spacing:0}
.fs-front.fs-bot{flex:0 0 auto;text-align:center;letter-spacing:.15em;background:var(--soft)}

.note{border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.note.nk-obs{border-left-color:#2f6fd0}.note.nk-concern{border-left-color:#c94545}.note.nk-good{border-left-color:#2e9e6b}.note.nk-follow{border-left-color:#b86e00}
.ntext{white-space:pre-wrap;margin:6px 0;word-break:break-word}
.nkb{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;color:#fff}
.nkb.obs{background:#2f6fd0}.nkb.concern{background:#c94545}.nkb.good{background:#2e9e6b}.nkb.follow{background:#b86e00}
.chip.nkc-obs.on{background:#2f6fd0;border-color:#2f6fd0}.chip.nkc-concern.on{background:#c94545;border-color:#c94545}.chip.nkc-good.on{background:#2e9e6b;border-color:#2e9e6b}.chip.nkc-follow.on{background:#b86e00;border-color:#b86e00}
.dh{font-family:var(--serif);font-size:1.05rem;margin:14px 0 4px;color:var(--pri)}
.dh.today{background:var(--pri2);border-radius:10px;padding:2px 10px}
.si{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff}
.si .st{min-width:86px;display:flex;flex-direction:column;font-size:.82rem;color:var(--mut)}
.si .st b{color:var(--ink);font-size:.95rem}
.si .sb{flex:1;min-width:0;display:flex;flex-direction:column;word-break:break-word}
.si.now{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri3);background:var(--pri2)}
.si.done{opacity:.55}
.sbadge{border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:800;background:var(--soft);color:var(--mut)}
.si.now .sbadge{background:var(--pri);color:#fff}.si.next .sbadge{background:var(--pri3);color:var(--ink)}
.sbtns{display:flex;gap:4px;flex:0 0 auto}
.bub .nx{font-weight:700;color:var(--pri)}
@media (max-width:520px){.si{flex-wrap:wrap}.si .st{min-width:78px}}
label.lb{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
#sfCls{width:100%}
#schForm input[type=time]{width:auto;min-width:130px}

body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),780px);z-index:30;display:flex;gap:2px;background:#fff;border:2px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 10px 26px -10px rgba(var(--glow),.55)}
.bn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;border-radius:22px;padding:6px 2px;cursor:pointer;color:var(--mut);font-weight:700;-webkit-tap-highlight-color:transparent}
.bn .bi2{font-size:1.3rem;line-height:1.1}
.bn .bl{font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn.on{background:var(--pri);color:#fff;box-shadow:0 5px 12px -5px rgba(var(--glow),.8)}
body.fsmode .bnav{display:none}
.ov.sheet{align-items:flex-end;padding:0}
.ov.sheet .mbox{max-width:600px;border-radius:26px 26px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;cursor:pointer}
.mtile.on{border-color:var(--pri);background:var(--pri2)}
.mtile .mi{font-size:1.5rem}.mtile small{color:var(--mut);font-size:.75rem;line-height:1.25}
@media print{.bnav{display:none!important}}

.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0}
.ph{text-align:center;font-size:.85rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ph.wk{opacity:.7}
.pc{position:relative;min-height:64px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:3px 3px 2px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;overflow:hidden}
.pc.out{border:0;background:none;cursor:default}
.pc.wk{background:#f5f6f6}
.pc.susp{background:#fde4e4;border-color:#efb0b0}
.pc.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri3)}
.pc.sel{background:var(--pri2)}
.pc .pn{font-weight:800;font-size:1.05rem}
.pc.today .pn{background:var(--pri);color:#fff;border-radius:999px;min-width:22px;text-align:center;padding:0 5px}
.pdots{display:flex;gap:2px;flex-wrap:wrap}
.pdots i,.plegend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.ptx{display:none;flex-direction:column;gap:1px;width:100%}
.ptx em{font-style:normal;font-size:.76rem;line-height:1.2;border-left:3px solid;padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.04);border-radius:3px}
.ptx em.more{border-color:var(--mut);color:var(--mut)}
@media (min-width:640px){.pc{min-height:104px}.ptx{display:flex}.pdots{display:none}}
.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;color:var(--mut);margin:4px 0 8px}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.pi{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:8px 10px;margin:8px 0;background:#fff}
.pi.k-susp{border-left-color:#c94545;background:#fff1f1}.pi.k-meet{border-left-color:#7b4fc4}.pi.k-remind{border-left-color:#b86e00}.pi.k-todo{border-left-color:#2e9e6b}.pi.k-event{border-left-color:#2f6fd0}
.pi.done .pbd b{text-decoration:line-through;opacity:.6}
.pbd{font-size:1.04rem;flex:1;min-width:0;display:flex;flex-direction:column;word-break:break-word}
.pico{font-size:1.2rem}
.pck{width:26px;height:26px;border-radius:8px;border:2px solid var(--pri3);background:#fff;color:#fff;font-weight:900;cursor:pointer;flex:0 0 auto}
.pck.on{background:var(--grn);border-color:var(--grn)}
.over .pi{background:#fff1f1}.over .pbd .muted:first-of-type{color:#c94545;font-weight:700}

function cleanName(n){return String(n).split('\t').map(x=>x.trim()).filter(Boolean).join(', ').replace(/^\s*\d+[\.\)]\s+/,'').replace(/\s+/g,' ').trim().slice(0,60)}
/* copy rows, columns, aisles and who sits where from one class to another (matched by name) */
function copySeating(src,dst){
  const byName={};dst.students.forEach(s=>{byName[s.name.toLowerCase()]=s.id});
  const sm=smap(src),used=new Set();
  const seats=src.seats.map(id=>{
    const s=id&&sm[id];if(!s)return null;
    const nid=byName[cleanName(s.name).toLowerCase()];
    if(!nid||used.has(nid))return null;used.add(nid);return nid;
  });
  dst.rows=src.rows;dst.cols=src.cols;dst.aisleCols=src.aisleCols.slice();dst.aisleRows=src.aisleRows.slice();
  dst.seats=seats;ensureSeats(dst);

function addStudents(c,names){
  let added=0,dup=0;const have=new Set(c.students.map(s=>s.name.toLowerCase()));
  names.forEach(n=>{n=cleanName(n);if(!n)return;const k=n.toLowerCase();if(have.has(k)){dup++;return}have.add(k);c.students.push({id:uid(),name:n});added++});

function resizeGrid(c,rows,cols){
  const old=c.seats,oc=c.cols,ns=Array(rows*cols).fill(null);
  old.forEach((id,i)=>{if(!id)return;const r=Math.floor(i/oc),k=i%oc;if(r<rows&&k<cols)ns[r*cols+k]=id});
  c.rows=rows;c.cols=cols;c.seats=ns;ensureSeats(c);

function attStats(c,sid){const r={P:0,A:0,L:0,E:0};for(const d in c.attendance){const v=c.attendance[d][sid];if(v&&r[v]!==undefined)r[v]++}return r}
function allTasks(c){const r=[];Object.keys(c.dayTags).sort().forEach(d=>c.dayTags[d].forEach(t=>r.push({id:t.id,type:t.type,label:t.label,date:d})));return r}
/* 'ok' = not missing, 'missing' = absent/excused (or flagged) and not yet made up, 'madeup' = was missing, now done */
function taskState(c,t,sid){
  const att=(c.attendance[t.date]||{})[sid];
  const flagged=!!(c.taskMiss[t.id]&&c.taskMiss[t.id][sid]);
  if(!(att==='A'||att==='E'||flagged))return 'ok';
  return (c.taskDone[t.id]&&c.taskDone[t.id][sid])?'madeup':'missing';
}
function absentOn(c,t,sid){const a=(c.attendance[t.date]||{})[sid];return a==='A'||a==='E'}
function openMissing(c){const ts=allTasks(c);let n=0;c.students.forEach(s=>ts.forEach(t=>{if(taskState(c,t,s.id)==='missing')n++}));return n}
function rowsData(c){
  const tasks=allTasks(c);
  return c.students.map(s=>{const a=attStats(c,s.id),tot=a.P+a.L+a.A+a.E,ml=[];
    tasks.forEach(t=>{if(taskState(c,t,s.id)==='missing')ml.push(taskName(t)+' ('+shortDate(t.date)+')')});
    return{id:s.id,name:s.name,pts:c.points[s.id]||0,picked:c.pickCount[s.id]||0,P:a.P,L:a.L,A:a.A,E:a.E,rate:tot?Math.round((a.P+a.L)/tot*100):null,miss:ml.length,missList:ml}});
}

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
const csvCell=v=>{v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function summaryCSV(c){
  const dates=Object.keys(c.attendance).filter(d=>Object.keys(c.attendance[d]).length).sort();
  const head=['Name','Points','Times Picked','Present','Late','Absent','Excused','Attendance Rate (%)','Missing Tasks (open)','Missing Task List'].concat(dates);
  const lines=[head.map(csvCell).join(',')];
  rowsData(c).forEach(r=>{
    const row=[r.name,r.pts,r.picked,r.P,r.L,r.A,r.E,r.rate===null?'':r.rate,r.miss,r.missList.join('; ')].concat(dates.map(d=>{const v=(c.attendance[d]||{})[r.id];return v?ST[v]+((c.dayTags[d]&&c.dayTags[d].length)?' ['+c.dayTags[d].map(taskName).join(', ')+']':''):''}));
    lines.push(row.map(csvCell).join(','));
  });
  return '﻿'+lines.join('\r\n');
}

function elig(c,ignoreRound){

function pickCands(c){

  let min=Infinity;pool.forEach(s=>{min=Math.min(min,c.lastRound[s.id]||0)});

}

function gSwap(c,a,b){
  if(a.id===b.id||(a.g<0&&b.g<0))return;
  const ia=a.g>=0?c.groups[a.g].indexOf(a.id):-1,ib=b.g>=0?c.groups[b.g].indexOf(b.id):-1;
  if(a.g>=0&&ia>=0)c.groups[a.g][ia]=b.id;

  save();
}
function gMove(c,id,to){

}

const toM=t=>+t.slice(0,2)*60+ +t.slice(3);
const hueOf=i=>{const k=S.classes.findIndex(x=>x.id===i.cid);if(k>=0)return (k*57+200)%360;let x=0;const s=sName(i);for(let n=0;n<s.length;n++)x=(x*31+s.charCodeAt(n))>>>0;return x%360};
function weekGrid(){
  const items=S.schedule.items,td=jsDay(),PPM=1;
  const hasWk=items.some(i=>i.days.some(d=>d>=6)),showWk=hasWk||ui.swk,nd=showWk?7:5;
  let minM=7*60,maxM=17*60;items.forEach(i=>{minM=Math.min(minM,toM(i.start));maxM=Math.max(maxM,toM(i.end))});
  minM=Math.floor(minM/60)*60;maxM=Math.ceil(maxM/60)*60;
  const H=(maxM-minM)*PPM,nowM=toM(nowT());
  let g='<div class="wgw"><div class="wg" style="grid-template-columns:44px repeat('+nd+',minmax(84px,1fr))"><div class="wh"></div>'
   +DAYS.slice(0,nd).map(d=>'<div class="wh'+(d[0]===td?' today':'')+'">'+d[1]+'</div>').join('');
  g+='<div class="wt" style="height:'+H+'px">'+Array.from({length:(maxM-minM)/60},(_,n)=>'<span style="top:'+(n*60*PPM)+'px">'+fmtT(String(minM/60+n).padStart(2,'0')+':00').replace(':00','')+'</span>').join('')+'</div>';
  for(let d=1;d<=nd;d++){
    const its=itemsOn(d).map(i=>({i:i,s:toM(i.start),e:toM(i.end)}));
    let cl=[],cEnd=0;const out=[];
    const flush=()=>{const le=[];cl.forEach(x=>{let l=le.findIndex(e=>e<=x.s);if(l<0){l=le.length;le.push(0)}le[l]=x.e;x.l=l});cl.forEach(x=>{x.n=le.length;out.push(x)});cl=[]};
    its.forEach(x=>{if(cl.length&&x.s>=cEnd){flush();cEnd=0}cl.push(x);cEnd=Math.max(cEnd,x.e)});if(cl.length)flush();
    g+='<div class="wd'+(d===td?' today':'')+'" style="height:'+H+'px">'
     +out.map(x=>{const hgt=(x.e-x.s)*PPM;return '<button class="wb" data-act="schEdit" data-id="'+x.i.id+'" style="top:'+((x.s-minM)*PPM)+'px;height:'+hgt+'px;left:calc('+(x.l/x.n*100)+'% + 2px);width:calc('+(100/x.n)+'% - 4px);--h:'+hueOf(x.i)+'"><b>'+esc(sName(x.i))+'</b><span>'+fmtT(x.i.start).replace(' ','')+'–'+fmtT(x.i.end).replace(' ','')+'</span>'+(hgt>=62&&x.i.room?'<span>'+esc(x.i.room)+'</span>':'')+'</button>'}).join('')
     +(d===td&&nowM>=minM&&nowM<=maxM?'<div class="wnow" style="top:'+((nowM-minM)*PPM)+'px"></div>':'')+'</div>';
  }
  g+='</div></div>';
  return '<section class="card"><h2>Weekly schedule</h2><p class="muted">Tap a class block to edit it. Gray areas are free time.</p>'+(items.length?g:'<p class="muted">No classes yet. Add your first one below.</p>')
   +(hasWk?'':'<div class="row noprint"><button class="chip s'+(ui.swk?' on':'')+'" data-act="swk">'+(ui.swk?'Hide':'Show')+' Sat &amp; Sun</button></div>')
   +(items.length?'<div class="row noprint"><button class="link" data-act="schClear">Clear entire schedule</button></div>':'')+'</section>';
}
const blankSf=()=>({id:'',title:'',cid:'',days:[],start:'',end:'',room:'',note:''});

function ovDay(d){

    const g={A:[],L:[],E:[]};k.students.forEach(s=>{const v=a[s.id];if(g[v])g[v].push(s.name)});

function ovTasks(){

const isPortrait=()=>window.innerHeight>window.innerWidth;
function renderFS(){
  const el=$('#fs');
  document.body.classList.toggle('fsmode',!!ui.fs);

  const tc=Array.from({length:c.cols},(_,k)=>'minmax(0,1fr)'+(ac.has(k)&&k<c.cols-1?' 16px':'')).join(' ');
  const tr=Array.from({length:c.rows},(_,q)=>{const r=FB()?c.rows-1-q:q;return 'minmax(0,1fr)'+((FB()?(ar.has(r-1)&&r>0):(ar.has(r)&&r<c.rows-1))?' 12px':'')}).join(' ');
  const W=ui.fsRot?window.innerHeight:window.innerWidth,H=ui.fsRot?window.innerWidth:window.innerHeight;
  const cw=(W-16-6*(c.cols+nAc-1)-16*nAc)/c.cols,chh=(H-16-44-(FB()?38:0)-6*(c.rows+nAr-1)-12*nAr)/c.rows;
  const fz=Math.max(9,Math.min(28,cw/7.2,chh/4.6));
  let cells='';
  for(let q=0;q<c.rows;q++){const r=FB()?c.rows-1-q:q;
    for(let k=0;k<c.cols;k++){

      if(ui.fsMode==='swap'){const ix=r*c.cols+k,has=id&&m[id];cells+='<button type="button" class="seat'+(has?'':' empty')+(ui.sel===ix?' sel':'')+'" data-act="fsSwap" data-i="'+ix+'">'+(has?'<span class="nm">'+esc(m[id].name)+'</span>':'<span class="idx">'+(ix+1)+'</span>')+'</button>'}
      else if(!id||!m[id])cells+='<div class="seat empty ni"></div>';
      else{
        const pts=c.points[id]||0,rw=S.settings.seat==='rows'?' rw'+(r%4):'';

        if(ui.fsMode==='points')cells+='<button type="button" class="seat'+rw+(ui.fsPop===r*c.cols+k?' pop':'')+'" data-act="fsSeat" data-i="'+(r*c.cols+k)+'">'+inner+'</button>';

    }
    if(FB()?(ar.has(r-1)&&r>0):(ar.has(r)&&r<c.rows-1))cells+='<div class="aisle-h" aria-hidden="true"></div>';
  }

  document.body.style.overflow='hidden';
  const sw=ui.fsMode==='swap',selId=sw&&ui.sel!=null?c.seats[ui.sel]:null,swapHint=sw?(selId&&m[selId]?'<b>'+esc(m[selId].name)+'</b> selected · tap a seat to swap':'Tap a student, then tap another seat to swap'):'';
  const swBtns=sw?'<button class="fs-btn" data-act="fsUndoSwap"'+((ui.swapHist||[]).length?'':' disabled')+'>↩ Undo</button><button class="fs-btn" data-act="fsAlpha">A–Z</button><button class="fs-btn" data-act="fsShuffle">🔀 Random</button>':'';
  const pm=ui.fsMode==='points',pvs=[1,2,3,5,-1],lg=c.log[c.log.length-1];

    +'<button class="fs-chip'+(pvs.indexOf(ui.pv)<0?' on':'')+'" data-act="custompv" aria-label="Custom amount">'+(pvs.indexOf(ui.pv)<0?fmtV(ui.pv):'✎')+'</button>':'';

  el.innerHTML='<div class="fs-bar">'+chips+swBtns+'<div class="fs-front'+(FB()?' tl':'')+'">'+(FB()?'':(pm?'▼ FRONT ▼':'▼ FRONT OF ROOM ▼'))+(lastTxt?'<b>'+lastTxt+'</b>':'')+swapHint+'</div>'
    +(pm?'<button class="fs-btn" data-act="undo"'+(lg?'':' disabled')+' aria-label="Undo last">↩</button>':'')
    +(por?'<button class="fs-btn" data-act="fsRot">'+(ui.fsRot?'↺ Upright':'⟲ Rotate')+'</button>':'')
    +'<button class="fs-btn" data-act="fsExit">✕ Exit</button></div>'

/* ---------- storage meter ---------- */
/* how much of the browser's storage the app is using (browsers allow roughly 5 million characters) */
function storeInfo(){
  let s='';try{s=localStorage.getItem(KEY)||''}catch(e){}
  if(!s)s=JSON.stringify(S);
  const limit=5000000;return{used:s.length,limit:limit,pct:Math.min(100,s.length/limit*100)};
}
function meterHtml(pct){return '<div class="meter'+(pct>=90?' bad':pct>=70?' warn':'')+'" role="img" aria-label="'+Math.round(pct)+' percent of storage used"><i style="width:'+Math.max(1,pct).toFixed(1)+'%"></i></div>'}
function storageCard(){
  const si=storeInfo();
  const note=si.pct>=90?'<div class="ssts bad">Storage is almost full. Download a backup, then delete old items you no longer need.</div>':si.pct>=70?'<div class="ssts bad">Storage is getting full. Download a backup, then delete old items you no longer need.</div>':'';
  return '<section class="card"><h2>Storage on this device</h2>'+meterHtml(si.pct)
    +'<p class="muted">Using <b>'+kb(si.used)+'</b> of about 5 MB ('+(si.pct<1?'under 1':Math.round(si.pct))+'%). The limit depends on the browser.</p>'+note
    +'<div class="stats"><div class="stat"><b>'+S.classes.length+'</b>Classes</div><div class="stat"><b>'+S.classes.reduce((a,k)=>a+k.students.length,0)+'</b>Students</div></div>'
    +'<p class="muted">Word files you export are saved on your device, not inside the app.</p></section>';
}

/* ---------- submission check ---------- */
Object.assign(ui,{subId:null,sbrush:'S',subDraft:''});
const subsSorted=c=>c.subs.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.name<b.name?-1:a.name>b.name?1:0));
function curSub(c){
  let s=c.subs.find(x=>x.id===ui.subId);
  if(!s&&c.subs.length){s=subsSorted(c)[0];ui.subId=s.id}
  return s||null;
}
function subCounts(c,sb){
  const d=(sb&&c.subStatus[sb.id])||{},r={S:0,I:0,L:0,M:0,X:0,U:0};
  c.students.forEach(st=>{const v=d[st.id];if(v&&r[v]!==undefined)r[v]++;else r.U++});
  return r;
}
V.subs=c=>{
  const sb=curSub(c);
  let h='<section class="card"><h2>Submission check</h2>'
   +'<p class="muted">Name the submission, choose a status, then tap students on the seat plan. Tap again to un-mark.</p>'
   +'<div class="row wrap"><input id="subName" type="text" maxlength="80" placeholder="Name, e.g. Lab report 2" autocomplete="off" value="'+esc(ui.subDraft)+'" style="flex:1;min-width:170px"><input id="subDate" type="date" value="'+today()+'" style="width:auto" aria-label="Date of submission"><button class="btn pri" data-act="subAdd">＋ Add</button></div>';
  if(!sb)return h+'<p class="muted">No submissions yet. Type a name above (for example “Activity 3” or “Project proposal”) and tap Add.</p></section>';
  const n=subCounts(c,sb);
  h+='<label class="lb" for="subSel">Submission</label><select id="subSel" data-chg="subSel">'
   +subsSorted(c).map(x=>{const k=subCounts(c,x);return '<option value="'+x.id+'"'+(x.id===sb.id?' selected':'')+'>'+esc(x.name)+' · '+shortDate(x.date)+' ('+k.S+'/'+c.students.length+' submitted)</option>'}).join('')+'</select>'
   +'<div class="row wrap"><button class="btn sm" data-act="subRename">✏️ Rename</button><button class="btn sm danger" data-act="subDel">🗑 Delete</button><button class="btn sm" data-act="subCsv">⬇ CSV (all submissions)</button></div>'
   +'<p class="muted"><b>'+esc(sb.name)+'</b> · '+prettyDate(sb.date)+'</p>'
   +'<div class="chips">'+Object.keys(SB).map(k=>'<button class="chip sb-'+k+(ui.sbrush===k?' on':'')+'" data-act="sbrush" data-v="'+k+'">'+SB[k][0]+'</button>').join('')+'</div>'
   +(c.students.length?seatGrid(c,'sub'):'<p class="muted">Add students first.</p>')
   +'<div class="stats">'+Object.keys(SB).map(k=>'<div class="stat sb-'+k+'"><b>'+n[k]+'</b>'+SB[k][0]+'</div>').join('')+'<div class="stat"><b>'+n.U+'</b>Not checked</div></div>'
   +'<div class="row wrap"><button class="btn pri" data-act="subMarkRest">✅ Mark the rest submitted</button><button class="btn danger" data-act="subClear">Clear this submission</button></div>';
  const d=c.subStatus[sb.id]||{},todo=c.students.filter(s=>d[s.id]!=='S'&&d[s.id]!=='X');
  h+='<div class="tagbox"><h3>Still to submit ('+todo.length+')</h3>'+(todo.length?'<ul class="todo-sub">'+todo.map(s=>'<li>'+esc(s.name)+(d[s.id]?' <span class="muted">· '+SB[d[s.id]][0]+'</span>':'')+'</li>').join('')+'</ul>':'<p class="muted">Everyone is accounted for.</p>')+'</div>';
  return h+'</section>';
};

/* ---------- new term (points reset) ---------- */
function termModalHtml(){
  const c=cur();
  return '<h2>🔄 Start a new term</h2><p class="muted">Class: <b>'+esc(c.name)+'</b>. Everyone starts again from 0. Your students and seat plan stay as they are.</p>'
    +'<label class="chk"><input type="checkbox" id="trCsv" checked> Download a copy of this term’s points first (CSV)</label>'
    +'<label class="chk"><input type="checkbox" id="trGrp" checked> Also reset group scores</label>'
    +'<div class="sec">Optionally clear as well</div>'
    +'<label class="chk"><input type="checkbox" id="trAtt"> Attendance records</label>'
    +'<label class="chk"><input type="checkbox" id="trSub"> Submission checks</label>'
    +'<label class="chk"><input type="checkbox" id="trTags"> Day tags (activity, quiz, exam…)</label>'
    +'<p class="muted">This cannot be undone. Notes and the planner are not touched.</p>'
    +'<div class="row wrap"><button class="btn danger" data-act="termGo">Reset for new term</button><button class="btn" data-act="closeModal">Cancel</button></div>';
}

Object.assign(act,{
  /* new term: reset points */
  termOpen(){ui.modal='term';renderModal();renderNav()},
  termGo(c){
    const on=id=>{const e=$('#'+id);return !!(e&&e.checked)};
    if(on('trCsv')){
      const rows=[['Student','Points']].concat(c.students.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.name,c.points[s.id]||0]));
      download('points-'+slug(c.name)+'-'+today()+'.csv','﻿'+rows.map(r=>r.map(csvq).join(',')).join('\r\n'),'text/csv');
    }
    c.points={};c.log=[];
    if(on('trGrp'))c.groupScores=c.groupScores.map(()=>0);
    if(on('trAtt'))c.attendance={};
    if(on('trSub'))c.subStatus={};
    if(on('trTags')){c.dayTags={};c.taskMiss={};c.taskDone={}}
    ui.fsPop=null;ui.modal=null;save();renderModal();renderNav();render();toast('New term started. Points reset to 0');
  },
  /* submission check */
  subAdd(c){
    const n=String(($('#subName')||{}).value||'').trim().slice(0,80);
    if(!n){toast('Type the name of the submission');return}
    const d=($('#subDate')||{}).value,sb={id:uid(),name:n,date:isD(d)?d:today()};
    c.subs.push(sb);ui.subId=sb.id;ui.subDraft='';save();render();toast('Added “'+n+'”');
  },
  subRename(c){const sb=curSub(c);if(!sb)return;const n=prompt('Rename this submission:',sb.name);if(n==null)return;const v=n.trim().slice(0,80);if(!v)return;sb.name=v;save();render()},
  subDel(c){const sb=curSub(c);if(!sb||!confirm('Delete "'+sb.name+'" and its marks?'))return;c.subs=c.subs.filter(x=>x.id!==sb.id);delete c.subStatus[sb.id];ui.subId=null;save();render();toast('Deleted')},
  sbrush(c,t){ui.sbrush=t.dataset.v;render()},
  subMarkRest(c){
    const sb=curSub(c);if(!sb)return;const d=c.subStatus[sb.id]=c.subStatus[sb.id]||{};let n=0;
    c.students.forEach(s=>{if(!d[s.id]){d[s.id]='S';n++}});
    if(!n){delete c.subStatus[sb.id];toast('Everyone is already marked');return}
    save();render();toast(n+' marked submitted');
  },
  subClear(c){const sb=curSub(c);if(!sb||!c.subStatus[sb.id])return;if(!confirm('Clear all marks for "'+sb.name+'"?'))return;delete c.subStatus[sb.id];save();render()},
  subCsv(c){
    if(!c.subs.length){toast('No submissions yet');return}
    const list=c.subs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    const rows=[['Student'].concat(list.map(x=>x.name+' ('+x.date+')'))].concat(c.students.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.name].concat(list.map(x=>{const v=(c.subStatus[x.id]||{})[s.id];return v?SB[v][0]:''}))));
    download('submissions-'+slug(c.name)+'-'+today()+'.csv','﻿'+rows.map(r=>r.map(csvq).join(',')).join('\r\n'),'text/csv');toast('CSV downloaded');
  },
  /* anecdotal notes as a Word file (same choices as the print report) */
  rpDocx(c){
    const f=$('#rpFrom').value,t=$('#rpTo').value,cat=$('#rpCat').value,st=$('#rpStu').value,sg=$('#rpSign').checked;
    if(!isD(f)||!isD(t)||f>t){toast('Check the dates');return}
    const list=(c.notes||[]).filter(n=>n.d>=f&&n.d<=t&&(!cat||n.k===cat)&&(!st||(n.s||[]).indexOf(st)>=0)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t);
    if(!list.length){toast('No notes match those choices');return}
    const m=smap(c),cn={};list.forEach(n=>{cn[n.k]=(cn[n.k]||0)+1});
    let b=DX.p('Anecdotal Records Report',{st:'Title'});
    b+=DX.p('Class: '+c.name+'   |   Period: '+prettyDate(f)+' – '+prettyDate(t)+'   |   Printed: '+pdate(),{c:'555555',af:120});
    b+=DX.p(list.length+' note'+(list.length===1?'':'s')+'  ·  '+Object.keys(NK).filter(k=>cn[k]).map(k=>NK[k][1]+': '+cn[k]).join('  ·  '),{af:160});
    const rows=[['Date','Category','Student(s)','Note']].concat(list.map(n=>[prettyDate(n.d)+'\n'+new Date(n.t||0).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),NK[n.k][1],(n.s||[]).filter(id=>m[id]).map(id=>m[id].name).join(', ')||'—',n.x]));
    b+=DX.tbl(rows,[1700,1400,2100,4772],{head:true});
    if(sg)b+=DX.p('Prepared by: ____________________     Date: ____________     Noted by: ____________________',{bf:480});
    ui.rp={f:f,t:t};download('anecdotal-records-'+slug(c.name)+'-'+today()+'.docx',DX.build(b),DOCX_MIME);
    ui.modal=null;renderModal();renderNav();toast('Word file downloaded');
  }
});

function importNames(c,names){
  const rep=$('#replaceChk')&&$('#replaceChk').checked;
  if(rep){if(!confirm('Replace the current list? Points, attendance, day tags and groups for this class will be cleared.'))return;wipeStudents(c)}
  const r=addStudents(c,names);
  toast('Added '+r.added+(r.dup?' ('+r.dup+' duplicate'+(r.dup>1?'s':'')+' skipped)':''));
  render();
}

let lettersPrefetched=false;
function prefetchLetters(){/* warm the browser cache while the More menu is open, so Letters opens faster */
  if(lettersPrefetched||!/^https?:$/.test(location.protocol)||!navigator.onLine)return;lettersPrefetched=true;
  try{const l=document.createElement('link');l.rel='prefetch';l.href='letters.html';document.head.appendChild(l)}catch(e){}
}
const chg={
  cls(c,t){S.activeId=t.value;ui.gman=false;ui.gtarget=null;ui.nedit=null;ui.ndraft=undefined;ui.nsel=[];ui.nst='';ui.nf='all';ui.sel=null;ui.gsel=null;ui.lastPick=null;save();render()},
  dim(c){
    const r=clamp(parseInt($('#rowsIn').value,10)||c.rows,1,40),k=clamp(parseInt($('#colsIn').value,10)||c.cols,1,12);
    resizeGrid(c,r,k);save();render();
  },
  date(c,t){ui.date=t.value||today();render()},
  nstud(c,t){ui.nst=t.value;ui.nlim=30;render()},
  sf(c,t){if(ui.sf)ui.sf[t.dataset.k]=t.value},
  popt(c,t){ui[t.dataset.k]=t.checked;render()},
  sort(c,t){ui.sort=t.value;render()},
  file(c,t){
    const f=t.files[0];if(!f)return;const csvMode=$('#csvMode')?$('#csvMode').value:'one';t.value='';
    const r=new FileReader();
    r.onload=()=>{
      const txt=String(r.result);let names;
      if(/\.csv$/i.test(f.name)){
        let rows=parseCSV(txt).filter(x=>x.some(y=>String(y).trim()));
        if(rows.length&&/^(name|names|student|students|learner|learners|student name|full name|last name|lastname|surname)$/i.test(String(rows[0][0]||'').trim()))rows.shift();
        names=rows.map(x=>csvMode==='two'&&x[1]&&String(x[1]).trim()?String(x[0]).trim()+', '+String(x[1]).trim():String(x[0]||'').trim());
      }else names=txt.split(/\r?\n/);
      if(!names.some(x=>String(x).trim())){toast('No names found in that file');return}
      importNames(cur(),names);
    };
    r.onerror=()=>toast('Could not read that file');
    r.readAsText(f);
  },
  impfile(c,t){
    const f=t.files[0];t.value='';if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);if(!o||!Array.isArray(o.classes))throw new Error('bad');
        const cls=o.classes.map(normClass);
        const nowT=Date.now();cls.forEach(k=>{k.mod=nowT;delete k._h;delete S.deleted[k.id]});
        if(ui.importMode==='replace'){
          if(!confirm('Replace ALL current data with this backup?'))return;
          S.classes.forEach(k=>{if(!cls.some(x=>x.id===k.id))S.deleted[k.id]=nowT});
          S.classes=cls;S.activeId=(o.activeId&&cls.find(k=>k.id===o.activeId))?o.activeId:(cls[0]&&cls[0].id);
          if(o.settings&&THEMES[o.settings.theme]){S.settings.theme=o.settings.theme;if(SEATS.some(x=>x[0]===o.settings.seat))S.settings.seat=o.settings.seat;applyTheme()}
        }else{
          cls.forEach(k=>{const i=S.classes.findIndex(x=>x.id===k.id);if(i>=0)S.classes[i]=k;else S.classes.push(k)});
          if(cls[0])S.activeId=cls[0].id;
        }
        if(!S.classes.length)S.classes.push(newClass('My Class'));
        if(!S.classes.find(k=>k.id===S.activeId))S.activeId=S.classes[0].id;
        if(o.schedule&&Array.isArray(o.schedule.items)&&(ui.importMode==='replace'||!S.schedule.items.length))S.schedule={mod:Date.now(),items:o.schedule.items.map(normSched).filter(Boolean)};
        if(o.planner&&Array.isArray(o.planner.items)&&(ui.importMode==='replace'||!S.planner.items.length))S.planner={mod:Date.now(),items:o.planner.items.map(normPlan).filter(Boolean)};
        ui.sel=null;ui.gsel=null;ui.lastPick=null;ui.tab='students';save();render();toast('Imported '+cls.length+' class'+(cls.length===1?'':'es'));
      }catch(e){alert('That file is not a valid Classroom Hub backup.')}
    };
    r.readAsText(f);
  }
};

Object.assign(chg,{subSel(c,t){ui.subId=t.value;render()},ovc(c,t){ui.ovc=t.value;render()}});
Object.assign(act,{
  ovDay(c,t){ui.ovd=t.dataset.d;render()},
  ovPrev(){const a=ui.ovm.split('-').map(Number);ui.ovm=dkey(new Date(a[0],a[1]-2,1)).slice(0,7);render()},
  ovNext(){const a=ui.ovm.split('-').map(Number);ui.ovm=dkey(new Date(a[0],a[1],1)).slice(0,7);render()},
  ovToday(){ui.ovm=today().slice(0,7);ui.ovd=today();render()},
  ovf(c,t){ui.ovf=t.dataset.v;render()}
});
document.addEventListener('input',e=>{const el=e.target;if(el&&el.id==='subName')ui.subDraft=el.value});
document.addEventListener('click',e=>{
  if(e.target.id==='modal'&&ui.modal){act.closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=act[t.dataset.act];if(f)f(cur(),t,e);
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const f=chg[t.dataset.chg];if(f)f(cur(),t,e);
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='tagLabel')ui.tagLabel=el.value;else if(el.id==='noteText')ui.ndraft=el.value;else if(el.dataset&&el.dataset.sf&&ui.sf)ui.sf[el.dataset.sf]=el.value;else if(el.dataset&&el.dataset.pf&&ui.pf)ui.pf[el.dataset.pf]=el.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.fs){exitFS();return}
  if(e.key==='Escape'&&ui.modal){act.closeModal();return}
  if(e.key==='Enter'&&e.target.id==='subName'){e.preventDefault();act.subAdd(cur());return}
  if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();act.addOne(cur());return}
  if(e.key==='Enter'&&e.target.id==='tagLabel'){e.preventDefault();ui.tagLabel=e.target.value;act.tagAdd(cur());return}
  if(e.key==='Enter'&&e.target.id==='ncName'){e.preventDefault();act.ncCreate();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('div[role=button][data-act]')){e.preventDefault();e.target.click()}
});

/* drag and drop (computer): seats and group members */
document.addEventListener('dragstart',e=>{
  const t=e.target.closest&&e.target.closest('[data-dk]');if(!t)return;
  ui.drag={k:t.dataset.dk,i:t.dataset.i,g:t.dataset.g,id:t.dataset.id};
  try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move'}catch(_){}
  t.classList.add('dragging');
});
document.addEventListener('dragend',()=>{ui.drag=null;document.querySelectorAll('.dragging,.over').forEach(el=>el.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{
  if(!ui.drag)return;
  const t=e.target.closest&&e.target.closest('[data-drop]');
  document.querySelectorAll('.over').forEach(x=>{if(x!==t)x.classList.remove('over')});
  if(t){e.preventDefault();t.classList.add('over')}
});
document.addEventListener('drop',e=>{
  const d=ui.drag;if(!d)return;
  const t=e.target.closest&&e.target.closest('[data-drop]');if(!t)return;
  e.preventDefault();const c=cur(),kind=t.dataset.drop;
  if(d.k==='seat'&&kind==='seat'){if(d.i!==t.dataset.i){swapSeats(c,+d.i,+t.dataset.i);ui.sel=null}}
  else if(d.k==='gm'){
    if(kind==='gm')gSwap(c,{g:+d.g,id:d.id},{g:+t.dataset.g,id:t.dataset.id});
    else if(kind==='grp'&&+t.dataset.g!==+d.g)gMove(c,d.id,+t.dataset.g);
    ui.gsel=null;
  }
  ui.drag=null;render();
});

const fsChanged=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)ui.fsEntered=true;else if(ui.fs&&ui.fsEntered)exitFS()};
document.addEventListener('fullscreenchange',fsChanged);
document.addEventListener('webkitfullscreenchange',fsChanged);
window.addEventListener('resize',()=>{if(ui.fs)renderFS();renderNav()});
window.addEventListener('orientationchange',()=>{if(ui.fs)setTimeout(renderFS,200)});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!S.sync.on||!canSync())return;if(!navigator.onLine)setSync('offline');else if(tokOk())syncNow(false);else setSync('needs')});
window.addEventListener('online',()=>{if(S.sync.on&&canSync()){if(tokOk())syncNow(false);else setSync('needs')}});
window.addEventListener('offline',()=>{if(S.sync.on&&canSync())setSync('offline')});
setInterval(()=>{if(S.sync.on&&canSync()&&document.visibilityState==='visible'&&tokOk()&&!syncing&&navigator.onLine)syncNow(false)},90000);

stamp();persist();
applyTheme();
render();
if(S.sync.on&&canSync()){setSync('needs');loadGIS().catch(()=>{});toast('☁️ Tap the cloud, then “Sync now”, to update from Google Drive')}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();

  if (!gisReady()){ loadGIS().catch(() => {}); return Promise.reject(new Error('retap')); }
  // The Google window must open straight from the tap, so nothing async may run before this point.
  return new Promise((res, rej) => {
    try { initTokenClient(); } catch(e) { rej(e); return; }
    gTcRes = res; gTcRej = rej;
    clearTimeout(gTcTimer);
    gTcTimer = setTimeout(() => { if (gTcRej === rej){ gTcRes = gTcRej = null; rej(new Error('timeout')); } }, 120000);
    try { gTc.requestAccessToken({ prompt: syncMeta.on ? '' : 'select_account' }); }
    catch(e) { clearTimeout(gTcTimer); gTcRes = gTcRej = null; rej(e); }
  });
}
async function gfetch(url, opt){
  opt = opt || {};
  const r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + gTok }, opt.headers || {}) }));
  if (r.status === 401){ gTok = null; gTokExp = 0; throw new Error('needs'); }
  if (!r.ok){
    let j = null; try { j = await r.json(); } catch(e) {}
    const er = new Error('http'); er.status = r.status;
    er.reason = (j && j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || (j && j.error && j.error.status) || '';
    er.detail = (j && j.error && j.error.message) || '';
    throw er;
  }
  return r;
}
async function findSyncFile(){
  const q = encodeURIComponent("name='" + SYNC_FILE + "' and trashed=false");
  const r = await gfetch(DRIVE_API + '/files?spaces=appDataFolder&q=' + q + '&orderBy=modifiedTime%20desc&pageSize=5&fields=files(id)');
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0].id : null;
}
async function uploadSync(fid, payload){
  const body = JSON.stringify(payload);
  if (fid){
    await gfetch(DRIVE_UPLOAD + '/files/' + fid + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body });
    return fid;
  }
  const bd = 'plg' + syncUid();
  const mp = '--' + bd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: SYNC_FILE, parents: ['appDataFolder'] }) + '\r\n--' + bd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + body + '\r\n--' + bd + '--';
  const r = await gfetch(DRIVE_UPLOAD + '/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: mp });
  return (await r.json()).id;
}
function syncFriendlyError(e){
  const m = e && e.message;
  if (m === 'popup_closed' || m === 'popup_failed_to_open' || m === 'popup') return 'The Google window was closed or blocked. Tap again, and allow pop-ups if asked.';
  if (m === 'access_denied' || m === 'denied') return 'Google sign-in was cancelled.';
  if (m === 'scope') return 'Please tick the Google Drive “app data” permission box when signing in.';
  if (m === 'timeout') return 'Google sign-in took too long. Tap Sync now to try again.';
  if (m === 'badfile') return 'The saved copy in Google Drive could not be read, so nothing was changed.';
  if (m === 'storage') return 'This browser could not store the synced data (its storage may be full).';
  if (m === 'offline' || e instanceof TypeError) return 'No internet connection.';
  if (e && e.status === 403 && /accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test((e.reason || '') + ' ' + (e.detail || ''))) return 'Google Drive is not switched on for this app yet. (In Google Cloud, the “Google Drive API” must be enabled.)';
  if (e && e.status === 403) return 'Google refused access. Sign in again and allow the Drive “app data” permission.';
  if (e && (e.status === 429 || e.status >= 500)) return 'Google Drive is busy right now. Try again in a minute.';
  return 'Sync did not work (' + (m || 'unknown error') + ').';
}
function syncEditing(){
  if (Object.keys(pendingSaves).length) return true;
  const a = document.activeElement, main = document.getElementById('plg-main');
  return !!(a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && main && main.contains(a));
}
function setSync(s){
  syncState = s;
  const dot = document.querySelector('#plg-sync-nav .plg-dot');
  if (dot){ if (s) dot.setAttribute('data-s', s); else dot.removeAttribute('data-s'); }
  if (currentView === 'sync') refreshSyncCard();
}
function scheduleSync(){
  if (!syncMeta.on || !syncCanRun()) return;
  if (syncing){ syncAgain = true; return; }
  if (!navigator.onLine){ setSync('offline'); return; }
  if (!syncTokOk()){ setSync('needs'); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(false), 6000);
  setSync('pending');
}

async function syncNow(interactive, link){
  if (!syncCanRun()) return;
  if (!syncMeta.on && !link) return;
  if (syncing){ if (interactive) showToast('Already syncing…'); else syncAgain = true; return; }
  clearTimeout(syncTimer);
  flushPendingSave();
  syncing = true; setSync('busy');
  let deferred = false;
  try {
    await getGToken(interactive);
    const fid = await findSyncFile();
    let rem = null;
    if (fid){
      const j = await (await gfetch(DRIVE_API + '/files/' + fid + '?alt=media')).json();
      if (!j || j.app !== 'ansci-letters' || !j.items || typeof j.items !== 'object') throw new Error('badfile');
      rem = j;
    }
    // Never rewrite the screen under someone who is typing; try again shortly.
    if (!interactive && syncEditing()){ deferred = true; setSync('pending'); return; }
    flushPendingSave();

    // Records from Drive (validated), and what this device has.
    const validKeys = new Set(allSyncKeys());
    const rItems = {};
    if (rem) Object.keys(rem.items).forEach(k => { if (validKeys.has(k)){ const c = checkRemoteItem(k, rem.items[k]); if (c) rItems[k] = c; } });

    // Which Google account is this? Don't mix two accounts' data by accident.
    let firstLink = !syncMeta.uid;
    if (rem && syncMeta.uid && rem.uid && rem.uid !== syncMeta.uid){
      if (!(interactive && confirm('This device was synced with a different Google account than the one you just used.\n\nCombine this device\'s letters data with that account\'s data?'))){
        syncMeta.on = false;
        syncMeta.err = 'This device was synced with a different Google account, so sync was turned off to keep the two separate. Tap “Use a different Google account”, then sign in again.';
        saveSyncMeta(); setSync('mismatch'); return;
      }
      firstLink = true;
    }

    const snap = localSnapshot();
    const localHas = Object.keys(snap).some(k => !snap[k].blank);
    const remoteHas = Object.keys(rItems).some(k => !rItems[k].blank);
    if (firstLink && interactive && localHas && remoteHas){
      if (!confirm('This device already has letters data, and so does your Google Drive.\n\nThey will be combined. Where the same section exists in both, the most recently edited one is kept.\n\nNot sure? Tap Cancel, use “Download backup” first, then try again.')){
        syncMeta.on = false; saveSyncMeta(); setSync(null); return;
      }
    }

    // Merge: sections row by row (the most recently edited row wins); other records as a whole.
    // Blank records never beat real data.
    const finalItems = {}, toApply = [];
    let needUpload = !rem;
    new Set(Object.keys(snap).concat(Object.keys(rItems))).forEach(k => {
      const l = snap[k], r = rItems[k];
      let take;
      if (!l) take = 'remote';
      else if (!r) take = (l.blank && !(syncMeta.items[k] && syncMeta.items[k].mod > 0)) ? 'none' : 'local';
      else if (JSON.stringify(r.data) === l.str) take = 'same';
      else if (l.kind === 'section' && l.rm && r.rm && !l.blank && !r.blank) take = 'rows';
      else if (r.mod > l.mod) take = 'remote';
      else if (r.mod < l.mod) take = 'local';
      else if (l.blank && !r.blank) take = 'remote';
      else take = 'local';
      if (take === 'remote'){ finalItems[k] = { mod: r.mod, data: r.data, rm: r.rm || undefined }; toApply.push(k); }
      else if (take === 'same'){
        finalItems[k] = { mod: r.mod, data: r.data, rm: r.rm || l.rm || undefined };
        if (!r.rm && l.rm) needUpload = true;
      }
      else if (take === 'local'){
        const mod = l.mod || Date.now();
        finalItems[k] = { mod, data: l.data, rm: l.rm || undefined };
        syncMeta.items[k].mod = mod;
        if (!r || r.mod !== mod || JSON.stringify(r.data) !== l.str) needUpload = true;
      }
      else if (take === 'rows'){
        const m = mergeRows(l, r, l.mod >= r.mod), mstr = JSON.stringify(m.data), mod = Math.max(l.mod, r.mod);
        finalItems[k] = { mod, data: m.data, rm: m.rm };
        if (mstr !== l.str) toApply.push(k); else { syncMeta.items[k].mod = mod; syncMeta.items[k].rm = m.rm; }
        if (mstr !== JSON.stringify(r.data) || mod !== r.mod) needUpload = true;
      }
    });
    if (!Object.keys(finalItems).length) needUpload = false;

    // Write what came from Drive into this device (all-or-nothing is not possible, so report any failure).
    const touched = [];
    toApply.forEach(k => {
      const str = JSON.stringify(finalItems[k].data);
      try { localStorage.setItem(k, str); } catch(e) { throw new Error('storage'); }
      syncMeta.items[k] = { h: hashStr(str), mod: finalItems[k].mod, rm: finalItems[k].rm };
      touched.push(k);
    });

    syncMeta.uid = (rem && rem.uid) ? String(rem.uid) : (syncMeta.uid || syncUid());
    if (needUpload) await uploadSync(fid, { app: 'ansci-letters', v: 1, uid: syncMeta.uid, savedAt: Date.now(), items: finalItems });

    syncMeta.on = true; syncMeta.last = Date.now(); syncMeta.err = '';
    saveSyncMeta();

    // If the section/term on screen changed, reload it so the screen matches.
    const cur = new Set([settingsKey(currentSubjectId, currentTermId)]);
    for (let i = 1; i <= SECTION_COUNT; i++) cur.add(sectionKey(currentSubjectId, currentTermId, i));
    if (touched.indexOf(PREF_KEY) >= 0){ loadTheme(); applyTheme(); render(); }
    if (touched.some(k => cur.has(k))){
      loadSubjectTermData(currentSubjectId, currentTermId);
      window.__plgLastGenerated = null; window.__plgLastCount = 0; window.__plgIndState = null;
      setSync('ok'); render();
    } else setSync('ok');
    if (interactive) showToast(touched.length ? 'Synced — got ' + touched.length + ' update' + (touched.length > 1 ? 's' : '') + ' from Google Drive' : 'Synced with Google Drive');
  } catch(e) {
    const m = e && e.message;
    if (m === 'needs'){ setSync(syncMeta.on ? 'needs' : null); }
    else if (m === 'retap'){ syncMeta.err = 'Google sign-in is still loading — tap once more.'; setSync(syncMeta.on ? 'needs' : null); if (interactive) showToast(syncMeta.err); }
    else if (!navigator.onLine || m === 'offline' || e instanceof TypeError){ setSync(syncMeta.on ? 'offline' : null); if (interactive) showToast('No internet connection.'); }
    else { syncMeta.err = syncFriendlyError(e); setSync(syncMeta.on ? 'err' : null); if (interactive) showToast(syncMeta.err); }
    saveSyncMeta();
  } finally {
    syncing = false;
    if (deferred){
      // Someone is typing: check again in a few seconds instead of waiting a full cycle.
      syncAgain = false; clearTimeout(syncTimer);
      syncTimer = setTimeout(() => syncNow(false), 3000);
    } else if (syncAgain){ syncAgain = false; scheduleSync(); }
    if (currentView === 'sync') refreshSyncCard();
  }
}

async function deleteDriveCopy(){
  if (syncing) return;
  syncing = true; setSync('busy');
  try {
    await getGToken(true);
    if (!confirm('Delete the copy of your letters data from Google Drive?\n\nThis device and your other devices keep the data they already have. Sync will be switched off on this device.')) { setSync(syncMeta.on ? 'ok' : null); return; }
    const fid = await findSyncFile();
    if (fid) await gfetch(DRIVE_API + '/files/' + fid, { method: 'DELETE' });
    syncMeta = { on: false, uid: '', last: 0, err: '', items: {} };
    saveSyncMeta(); setSync(null);
    showToast('Google Drive copy deleted');
  } catch(e) {
    const m = e && e.message;
    syncMeta.err = (m === 'needs' || m === 'retap') ? 'Please sign in with Google first, then try again.' : syncFriendlyError(e);
    saveSyncMeta(); setSync(syncMeta.on ? 'err' : null);
    showToast(syncMeta.err);
  } finally { syncing = false; if (currentView === 'sync') refreshSyncCard(); }
}
function syncTurnOff(){
  syncMeta.on = false; syncMeta.err = ''; saveSyncMeta();
  clearTimeout(syncTimer); setSync(null);
  showToast('Sync is off on this device');
}
function syncForgetAccount(){
  if (!confirm('Disconnect this device from its Google account?\n\nYour data on this device is kept. You can then sign in with a different account.')) return;
  syncMeta = { on: false, uid: '', last: 0, err: '', items: {} };
  saveSyncMeta(); clearTimeout(syncTimer); gTok = null; gTokExp = 0; setSync(null);
}

const SYNC_STATUS_TEXT = {
  ok: 'Synced',
  busy: 'Syncing…',
  pending: 'Saving your latest changes to Google Drive…',
  needs: 'Signed out of Google — tap “Sync now” to sign in again.',
  offline: 'No internet connection. Your changes are saved on this device and will sync when you’re back online.',
  err: 'There was a problem syncing.',
  mismatch: 'Sync is off: this device was linked to a different Google account.'
};
function fmtSyncTime(ms){ try { return new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e) { return ''; } }
function refreshSyncCard(){
  const card = document.getElementById('plg-sync-card');
  if (card) fillSyncCard(card);
}
function fillSyncCard(card){
  const canRun = syncCanRun();
  let statusHtml = '';
  if (!canRun){
    statusHtml = '<div class="plg-syncmsg warn">Sync only works on your online page (carlabaldonade.github.io), not on this address. Open the letters page from Classroom Hub or from its web address to use it.</div>';
  } else if (!syncMeta.on){
    statusHtml = '<div class="plg-syncmsg">Sync is off on this device.</div>' + (syncMeta.err ? '<div class="plg-syncmsg bad">' + escapeHtml(syncMeta.err) + '</div>' : '');
  } else {
    const st = syncState || 'needs';
    let line = SYNC_STATUS_TEXT[st] || SYNC_STATUS_TEXT.needs;
    if (st === 'ok' && syncMeta.last) line += ' · last ' + fmtSyncTime(syncMeta.last);
    statusHtml = '<div class="plg-syncmsg ' + (st === 'ok' ? 'good' : (st === 'err' || st === 'mismatch') ? 'bad' : 'warn') + '">' + escapeHtml(line) + '</div>'
      + ((st === 'err' || st === 'mismatch') && syncMeta.err ? '<div class="plg-syncmsg bad">' + escapeHtml(syncMeta.err) + '</div>' : '');
  }
  const busy = syncing;
  let buttons = '';
  if (canRun){
    buttons = syncMeta.on
      ? '<button type="button" class="plg-btn" id="plg-sync-now"' + (busy ? ' disabled' : '') + '>Sync now</button> <button type="button" class="plg-btn secondary" id="plg-sync-off">Turn off sync on this device</button>'
      : '<button type="button" class="plg-btn" id="plg-sync-link"' + (busy ? ' disabled' : '') + '>Sign in with Google &amp; turn on sync</button>';
  }
  card.innerHTML = `
    <h2>Sync across devices</h2>
    <p class="plg-sub">Keep your subjects, sections, students and scores the same on every device by saving a private copy in your own Google Drive &mdash; the same Google account you use for Classroom Hub.</p>
    ${statusHtml}
    <div class="plg-syncbtns">${buttons}</div>
    <ul class="plg-synclist">
      <li>The copy is a small hidden file in your Drive (it doesn&rsquo;t appear in My Drive). Only this page, signed in as you, can open it.</li>
      <li>Everything is saved on the device first, so the page still works offline. It syncs when you&rsquo;re back online and signed in.</li>
      <li>If the same section was edited on two devices, the most recent edit is kept for that section.</li>
      <li>Restoring a backup counts as a new edit and replaces those sections on your other devices too.</li>
      <li>Google sign-in lasts about an hour. After that, tap &ldquo;Sync now&rdquo; once to sign in again. Your theme choice stays on each device.</li>
    </ul>
    ${canRun && (syncMeta.on || syncMeta.uid) ? '<div class="plg-synclinks"><button type="button" class="plg-linkbtn" id="plg-sync-forget">Use a different Google account</button><button type="button" class="plg-linkbtn danger" id="plg-sync-delete">Delete my Google Drive copy</button></div>' : ''}`;
  const on = (id, fn) => { const el = card.querySelector(id); if (el) el.onclick = fn; };
  on('#plg-sync-link', () => syncNow(true, true));
  on('#plg-sync-now', () => syncNow(true));
  on('#plg-sync-off', syncTurnOff);
  on('#plg-sync-forget', syncForgetAccount);
  on('#plg-sync-delete', deleteDriveCopy);
}
function renderSync(container){
  const card = document.createElement('div'); card.className = 'plg-card'; card.id = 'plg-sync-card';
  fillSyncCard(card);
  container.appendChild(card);
  if (syncCanRun() && !gisReady()) loadGIS().catch(() => {});
}

// ---------- Main render ----------
function render(){
  renderNav();
  const main = document.getElementById('plg-main');
  main.innerHTML = "";
  const view = document.createElement('div'); view.className = 'plg-view active';
  if (currentView === 'preview' || currentView === 'individual') view.classList.add('printing');
  main.appendChild(view);

  if (currentView === 'setup') renderSetup(view);
  else if (currentView === 'preview') renderPreview(view);
  else if (currentView === 'individual') renderIndividual(view);
  else if (currentView === 'theme') renderTheme(view);
  else if (currentView === 'sync') renderSync(view);
  else if (currentView.startsWith('section-')) renderSection(view, Number(currentView.split('-')[1]));
}

async function init(){
  loadTheme();
  applyTheme();
  loadSyncMeta();
  if (syncMeta.on && syncCanRun() && navigator.onLine) loadGIS().catch(() => {});
  const main = document.getElementById('plg-main');
  main.innerHTML = '<p style="padding:20px;color:#777;">Loading your saved data\u2026</p>';
  await loadState();
  render();
}
init();
// Safety net: if the tab is closed or the browser is switched right after
// typing, make sure the last edit still gets written to storage.
window.addEventListener('beforeunload', flushPendingSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPendingSave(); });
// Pick up changes made on other devices when this page comes back into view, and retry after going online.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncMeta.on && syncCanRun() && syncTokOk()) syncNow(false); });
window.addEventListener('online', () => scheduleSync());

})();
</script>

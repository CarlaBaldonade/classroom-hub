<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C" id="metaTheme">
<title>ANSCI Letter Generator</title>
<!-- No DOCTYPE on purpose: this page has always printed its letters in the browser's compatibility mode,
     and adding one shifts the printed layout slightly. Keep it this way so printouts stay identical. -->
<style>html{-webkit-text-size-adjust:100%}body{margin:0}@media print{body{margin:8px}}</style>
</head>
<body>
<div id="plg-root">
<style>
#plg-root {
  --navy: #1B3A5C;
  --navy-dark: #12283f;
  --gold: #B8860B;
  --cream: #F7F5EF;
  --paper: #FFFFFF;
  --ink: #2A2A2A;
  --line: #D8D2C4;
  --green: #2F7A4F;
  --green-bg: #E8F3EC;
  --amber: #A9720C;
  --amber-bg: #FBF1DD;
  --red: #B03A2E;
  --red-bg: #FBEAE7;
  --head-bg: #EEF1F5;
  --soft: #FBFAF6;
  --glow: 27,58,92;
  --pat: none;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--cream);
  min-height: 100vh;
  box-sizing: border-box;
}
#plg-root *, #plg-root *::before, #plg-root *::after { box-sizing: border-box; }
#plg-root { display: flex; min-height: 100vh; }

/* Sidebar */
.plg-nav {
  width: 190px;
  flex-shrink: 0;
  background: var(--navy);
  color: #fff;
  padding: 18px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.plg-nav h1 {
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.75;
  margin: 4px 8px 12px;
  font-weight: 600;
}
.plg-nav button {
  all: unset;
  cursor: pointer;
  padding: 9px 10px;
  border-radius: 6px;
  font-size: 13.5px;
  color: #DDE6EE;
  transition: background 0.15s;
}
.plg-nav button:hover { background: rgba(255,255,255,0.08); }
.plg-nav button.active { background: var(--gold); color: #241C05; font-weight: 600; }
.plg-nav .plg-sep { height: 1px; background: rgba(255,255,255,0.15); margin: 10px 4px; }
.plg-nav .plg-count {
  float: right;
  font-size: 11px;
  opacity: 0.7;
}

/* Main content */
.plg-main { flex: 1; padding: 28px 34px; overflow-x: auto; }
.plg-view { display: none; max-width: 1180px; }
.plg-view.active { display: block; }

.plg-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px 24px;
  margin-bottom: 18px;
}
.plg-card h2 {
  margin: 0 0 4px;
  font-size: 18px;
  color: var(--navy);
}
.plg-card .plg-sub {
  margin: 0 0 16px;
  font-size: 13px;
  color: #6b6b6b;
}
.plg-field { margin-bottom: 14px; }
.plg-field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: #4a4a4a;
  margin-bottom: 4px;
}
.plg-field input, .plg-field select {
  width: 100%;
  max-width: 340px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
}
.plg-row { display: flex; gap: 28px; flex-wrap: wrap; }
.plg-maxgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 8px;
  max-width: 720px;
}
.plg-maxgrid div { display: flex; flex-direction: column; gap: 3px; }
.plg-maxgrid label { font-size: 11px; color: #6b6b6b; font-weight: 600; }
.plg-maxgrid input {
  width: 100%;
  padding: 6px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: 13px;
  text-align: center;
}
.plg-btn {
  all: unset;
  cursor: pointer;
  background: var(--navy);
  color: #fff;
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 13.5px;
  font-weight: 600;
  display: inline-block;
}
.plg-btn:hover { background: var(--navy-dark); }
.plg-btn.secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
.plg-btn.secondary:hover { background: var(--head-bg); }
.plg-btn.gold { background: var(--gold); color: #241C05; }
.plg-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.plg-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.plg-section-head input.plg-section-name {
  font-size: 17px; font-weight: 700; color: var(--navy);
  border: 1px solid transparent; border-radius: 6px; padding: 6px 8px;
  background: transparent; max-width: 320px;
}
.plg-section-head input.plg-section-name:hover, .plg-section-head input.plg-section-name:focus {
  border-color: var(--line); background: #fff;
}

table.plg-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.plg-table th, table.plg-table td {
  border: 1px solid var(--line);
  padding: 4px 5px;
  text-align: center;
  white-space: nowrap;
}
table.plg-table th { background: var(--head-bg); color: var(--navy); font-size: 11px; }
table.plg-table td.plg-name-cell { text-align: left; min-width: 150px; }
/* Freeze the student name column so it stays visible when scrolling horizontally */
table.plg-table td.plg-name-cell,
table.plg-table th.plg-name-head {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #fff;
  box-shadow: 2px 0 4px rgba(0,0,0,0.08);
}
table.plg-table th.plg-name-head {
  z-index: 3;
  background: var(--head-bg);
}
table.plg-table td.plg-name-cell input { width: 100%; border: 1px solid transparent; padding: 4px; border-radius: 4px; font-size: 12.5px; }
table.plg-table td.plg-name-cell input:hover, table.plg-table td.plg-name-cell input:focus { border-color: var(--line); }
/* Remove number input spinner arrows so fields are just type-and-go */
#plg-root input[type=number]::-webkit-outer-spin-button,
#plg-root input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
#plg-root input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}
table.plg-table input.plg-score { width: 44px; border: 1px solid #e4e0d4; border-radius: 4px; padding: 3px; text-align: center; font-size: 12px; }
table.plg-table input.plg-score:focus { border-color: var(--navy); outline: none; }
table.plg-table th.plg-quiz-max input { width: 44px; border: 1px solid var(--gold); border-radius: 4px; text-align: center; font-size: 11.5px; padding: 2px; }
table.plg-table th.plg-quiz-max { position: relative; }
/* ---- spreadsheet-style score grid ---- */
.plg-sheetwrap { overflow: auto; max-height: 74vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.plg-sheetbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; font-size: 12px; color: #6b6b6b; }
.plg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.plg-tabs button { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--navy); color: var(--navy); background: #fff; font-size: 13px; font-weight: 600; }
.plg-tabs button:hover { background: var(--head-bg); }
.plg-tabs button.on { background: var(--navy); color: #fff; }
#plg-root input.plg-cell-sel { box-shadow: inset 0 0 0 9999px rgba(37,99,235,0.18); }
table.plg-table thead th { position: sticky; z-index: 4; }
table.plg-table thead th.plg-quiz-max { position: sticky; }
table.plg-table thead th.plg-name-head { left: 0; z-index: 7; }
table.plg-table thead th.plg-hps-label { left: 0; z-index: 7; text-align: left; font-size: 10.5px; background: #fff6e0; }
table.plg-table thead tr.plg-hps th { background: #fff6e0; }
/* flat, spreadsheet look: no boxes around cells, just grid lines */
#plg-root table.plg-table td.plg-c, #plg-root table.plg-table th.plg-c { padding: 0; }
#plg-root table.plg-table td.plg-c input, #plg-root table.plg-table th.plg-c input {
  display: block; width: 100%; min-width: 48px; margin: 0; padding: 7px 2px; border: 0; border-radius: 0;
  background: transparent; text-align: center; font-size: 12.5px; box-shadow: none; outline: none;
}
#plg-root table.plg-table th.plg-c input { font-weight: 700; }
#plg-root table.plg-table td.plg-c input:focus, #plg-root table.plg-table th.plg-c input:focus {
  background: #fff; box-shadow: inset 0 0 0 2px var(--navy);
}
#plg-root table.plg-table td.plg-c input.plg-cell-sel, #plg-root table.plg-table th.plg-c input.plg-cell-sel { box-shadow: inset 0 0 0 9999px rgba(37,99,235,0.18); }
#plg-root table.plg-table td.plg-name-cell { padding: 0; }
#plg-root table.plg-table td.plg-name-cell input { display: block; width: 100%; margin: 0; padding: 7px 8px; border: 0; border-radius: 0; background: transparent; font-size: 12.5px; box-shadow: none; outline: none; }
#plg-root table.plg-table td.plg-name-cell input:hover { border: 0; }
#plg-root table.plg-table td.plg-name-cell input:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
#plg-root table.plg-table thead th.plg-hps-label { background: #fff6e0; }
button.plg-col-clear {
  all: unset;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 13px;
  height: 13px;
  margin-left: 3px;
  border-radius: 50%;
  background: rgba(176,58,46,0.12);
  color: var(--red);
  font-size: 10px;
  line-height: 1;
  font-weight: 700;
  vertical-align: middle;
}
button.plg-col-clear:hover { background: var(--red); color: #fff; }
.plg-badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.plg-badge.out { background: var(--green-bg); color: var(--green); }
.plg-badge.sat { background: var(--amber-bg); color: var(--amber); }
.plg-badge.imp { background: var(--red-bg); color: var(--red); }
.plg-badge.none { background: #eee; color: #999; }

.plg-summary-cards { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.plg-summary-cards .plg-scard { flex: 1; min-width: 140px; border-radius: 10px; padding: 14px 16px; }
.plg-scard .num { font-size: 26px; font-weight: 700; }
.plg-scard .lbl { font-size: 12px; opacity: 0.85; }
.plg-scard.out { background: var(--green-bg); color: var(--green); }
.plg-scard.sat { background: var(--amber-bg); color: var(--amber); }
.plg-scard.imp { background: var(--red-bg); color: var(--red); }
.plg-scard.tot { background: var(--head-bg); color: var(--navy); }

.plg-empty-note { font-size: 13px; color: #888; padding: 10px 0; }

#plg-root[data-cute]{background:var(--cream) var(--pat) 0 0/84px 84px}
#plg-root[data-cute] .plg-nav{border-radius:0 22px 22px 0;box-shadow:6px 0 14px -8px rgba(var(--glow),.55)}
#plg-root[data-cute] .plg-nav button, #plg-root[data-cute] .plg-nav a.plg-backlink{color:#fff;border-radius:999px}
#plg-root[data-cute] .plg-nav button.active{color:#241C05;box-shadow:0 3px 8px -3px rgba(var(--glow),.6)}
#plg-root[data-cute] .plg-card{position:relative;border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 18px -12px rgba(var(--glow),.6)}
#plg-root[data-cute] .plg-card:not(:has(table))::before{content:"";position:absolute;inset:5px;border:1.5px dashed var(--gold);border-radius:15px;opacity:.7;pointer-events:none}
#plg-root[data-cute] .plg-btn{border-radius:999px}
#plg-root[data-cute] .plg-btn:not(.secondary):not(.gold){box-shadow:0 5px 12px -5px rgba(var(--glow),.8)}
#plg-root[data-cute] .plg-field input, #plg-root[data-cute] .plg-field select{border-radius:12px;border-width:2px}
#plg-root[data-cute] .plg-summary-cards .plg-scard{border-radius:18px}
#plg-root[data-cute] table.plg-table th.plg-quiz-max input{border-color:var(--navy)}

/* mascot, toast, sparkles */
.plg-nav a.plg-backlink{cursor:pointer;padding:9px 10px;border-radius:6px;font-size:13.5px;color:#DDE6EE;text-decoration:none;display:block}
.plg-nav a.plg-backlink:hover{background:rgba(255,255,255,0.08)}
/* .plg-nav prefix: must out-rank '.plg-nav button { all: unset }' */
.plg-nav .plg-mas{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:76px;height:76px;margin:0 auto 6px;padding:0;-webkit-tap-highlight-color:transparent;animation:plg-bob 3.2s ease-in-out infinite}
.plg-nav .plg-mas svg{width:100%;height:100%;display:block}
.plg-nav .plg-mas.jump{animation:plg-jump .5s ease-out}
.plg-nav .plg-mas:hover{background:none}
.plg-nav .plg-mas:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}
@keyframes plg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes plg-jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
.plg-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 8px 20px -8px rgba(var(--glow),.8);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.plg-toast.show{opacity:1;transform:translate(-50%,0)}
.plg-spk{position:fixed;pointer-events:none;font-size:22px;z-index:49;animation:plg-spk 1.1s ease-out forwards}
@keyframes plg-spk{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2) rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.plg-nav .plg-mas,.plg-nav .plg-mas.jump{animation:none}.plg-spk{display:none}}


/* sync */
.plg-nav button .plg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:middle;background:rgba(255,255,255,.35)}
.plg-nav button .plg-dot[data-s=ok]{background:#5fd38d}
.plg-nav button .plg-dot[data-s=busy], .plg-nav button .plg-dot[data-s=pending]{background:#ffd166}
.plg-nav button .plg-dot[data-s=needs], .plg-nav button .plg-dot[data-s=offline]{background:#ffb347}
.plg-nav button .plg-dot[data-s=err], .plg-nav button .plg-dot[data-s=mismatch]{background:#ff7b7b}
.plg-syncmsg{font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:10px;background:var(--head-bg);color:var(--navy);margin:0 0 10px;max-width:640px}
.plg-syncmsg.good{background:var(--green-bg);color:var(--green)}
.plg-syncmsg.warn{background:var(--amber-bg);color:var(--amber)}
.plg-syncmsg.bad{background:var(--red-bg);color:var(--red)}
.plg-syncbtns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.plg-synclist{margin:0 0 10px;padding-left:20px;font-size:13px;color:#4a4a4a;max-width:680px;line-height:1.5}
.plg-synclist li{margin-bottom:4px}
.plg-synclinks{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.plg-linkbtn{all:unset;cursor:pointer;font-size:12.5px;color:var(--navy);text-decoration:underline}
.plg-linkbtn.danger{color:var(--red)}
.plg-linkbtn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* theme picker */
.plg-themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-width:760px}
.plg-themebtn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:12.5px;font-weight:600;color:#4a4a4a;text-align:center}
.plg-themebtn:hover{border-color:var(--gold)}
.plg-themebtn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.plg-themebtn.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--gold)}
.plg-themebtn .mini{width:44px;height:44px;display:block}
.plg-themebtn .mini svg{width:100%;height:100%;display:block}
.plg-themebtn .tsw{width:44px;height:44px;border-radius:50%;display:block}

/* ---------- Letter / print styles ---------- */
#plg-print-container { margin-top: 10px; }
.plg-letter-page {
  background: #fff;
  width: 210mm;
  min-height: 297mm;
  margin: 0 auto 26px;
  padding: 14mm 18mm;
  box-shadow: 0 1px 6px rgba(0,0,0,0.15);
  font-family: Georgia, 'Times New Roman', serif;
  color: #1a1a1a;
  font-size: 11.8px;
  line-height: 1.42;
}
.plg-letter-head { text-align: center; margin-bottom: 8px; }
.plg-letter-head img { width: 54px; height: 54px; margin-bottom: 3px; }
.plg-letter-head .l1 { font-weight: bold; }
.plg-letter-head .l-tag { margin-top: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; font-size: 13px; }
.plg-letter-date { margin: 10px 0 10px; }
.plg-letter-body p { margin: 0 0 9px; }
table.plg-letter-table { width: 100%; border-collapse: collapse; margin: 8px 0 10px; font-size: 11.3px; }
table.plg-letter-table th, table.plg-letter-table td { border: 1px solid #333; padding: 4px 6px; text-align: center; }
table.plg-letter-table td.comp-name { text-align: left; }
table.plg-letter-table tr.overall td { font-weight: bold; }
.plg-comp-missing { display: block; font-size: 8.8px; font-weight: normal; color: #b42318; line-height: 1.2; }
.plg-notes-box { border: 1px solid #333; margin: 10px 0; min-height: 46px; padding: 5px 8px; }
.plg-notes-box .lbl { font-weight: bold; font-size: 11.3px; }
.plg-visit-box { border: 1px solid #333; padding: 8px 10px; margin: 8px 0 10px; }
.plg-sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
.plg-sig-grid .line { border-bottom: 1px solid #333; margin: 26px 0 4px; }
.plg-sig-grid .name { font-weight: bold; }
.plg-sig-grid .role { font-style: italic; font-size: 11px; }
.plg-rating-tag { font-weight: bold; }
.plg-rating-tag.out { color: var(--green); }
.plg-rating-tag.sat { color: var(--amber); }
.plg-rating-tag.imp { color: var(--red); }

@page {
  size: A4;
  margin: 0;
}
@media print {
  #plg-root .plg-nav, #plg-root .no-print { display: none !important; }
  #plg-root .plg-main { padding: 0; overflow: visible; }
  #plg-root .plg-view { display: none !important; }
  #plg-root .plg-view.printing { display: block !important; }
  #plg-print-container { margin-top: 0; }
  .plg-letter-page { box-shadow: none; margin: 0; page-break-after: always; break-after: page; width: auto; min-height: 0; }
  .plg-letter-page:last-child { page-break-after: auto; break-after: auto; }
  /* Themes never reach the paper: letters always print exactly as before */
  #plg-root, #plg-root[data-cute] { background: #fff !important; }
  #plg-root[data-cute] .plg-card { border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  #plg-root[data-cute] .plg-card::before { display: none !important; }
  .plg-toast, .plg-spk { display: none !important; }
}

@media (max-width: 720px) {
  #plg-root { flex-direction: column; }
  .plg-nav { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px; }
  .plg-nav > * { flex: 0 0 auto; }
  .plg-nav > div:not(.plg-sep) { width: 150px; margin: 0 !important; }
  .plg-nav h1 { display: none; }
  .plg-nav .plg-sep { width: 1px; height: 24px; margin: 0 4px; }
  .plg-nav .plg-mas { width: 40px; height: 40px; margin: 0; flex: 0 0 40px; }
  .plg-nav button, .plg-nav a.plg-backlink { white-space: nowrap; flex-shrink: 0; }
  #plg-root[data-cute] .plg-nav { border-radius: 0 0 22px 22px; box-shadow: 0 6px 14px -8px rgba(var(--glow),.55); }
  .plg-main { padding: 16px 12px; }
  .plg-card { padding: 16px 14px; }
}

const WW_COUNT = 8;

// ---------- Subjects ----------
// group 'A' = Science/Math/English rating bands, group 'B' = everyone else.
// altWeights = true means MAPEH/TLE weighting (20/60/20) instead of the
// standard 20/50/30 split used by every other subject.
const SUBJECTS = [
  { id: 'science',  label: 'Science',  group: 'A' },
  { id: 'math',     label: 'Math',     group: 'A' },
  { id: 'english',  label: 'English',  group: 'A' },
  { id: 'filipino', label: 'Filipino', group: 'B' },
  { id: 'ap',       label: 'Araling Panlipunan (AP)', group: 'B' },
  { id: 'esp',      label: 'Edukasyon sa Pagpapakatao (ESP)', group: 'B' },
  { id: 'research', label: 'Research', group: 'B' },
  { id: 'spanish',  label: 'Spanish',  group: 'B' },
  { id: 'mapeh',    label: 'MAPEH',    group: 'B', altWeights: true },
  { id: 'tle',      label: 'Creative Technologies', group: 'B', altWeights: true },
];
function getSubject(id){ return SUBJECTS.find(s => s.id === id) || SUBJECTS[0]; }
function getWeights(subject){
  return subject.altWeights
    ? { ww: 0.20, peta: 0.60, summ: 0.20 }
    : { ww: 0.20, peta: 0.50, summ: 0.30 };
}
// Within the Summative component itself, Summative Test 1 and Summative Test 2
// each count for 30% of the Summative grade, while the (heavier) Term Exam
// counts for 40%. These three sub-weights always sum to 1.0, and get
// renormalized on the fly (see calcStudent) for whichever of the three
// actually have a score entered so far, so partial grades before the Term
// Exam is given still compute correctly.
const SUMM_SUBWEIGHTS = { st1: 0.30, st2: 0.30, te: 0.40 };
function getThresholds(subject){
  // Both groups use the same "Outstanding" floor; only the Satisfactory /
  // Needs Improvement split differs.
  return subject.group === 'A' ? { out: 90, sat: 85 } : { out: 90, sat: 83 };
}

// Transmutation ranges per DepEd Order No. 15, s. 2026 (Adjusted Transmutation Table):
// [min initial grade, max initial grade, transmuted grade], checked high to low.
// Initial grades are rounded to 2 decimals before lookup, so the ranges leave no gaps.
const TRANSMUTATION_TABLE = [
  [99.50, 100.00, 100],
  [98.32, 99.49, 99],
  [97.14, 98.31, 98],
  [95.96, 97.13, 97],
  [94.78, 95.95, 96],
  [93.60, 94.77, 95],
  [92.42, 93.59, 94],
  [91.24, 92.41, 93],
  [90.06, 91.23, 92],
  [88.88, 90.05, 91],
  [87.70, 88.87, 90],
  [86.52, 87.69, 89],
  [85.34, 86.51, 88],
  [84.16, 85.33, 87],
  [82.98, 84.15, 86],
  [81.80, 82.97, 85],
  [80.62, 81.79, 84],
  [79.44, 80.61, 83],
  [78.26, 79.43, 82],
  [77.08, 78.25, 81],
  [75.90, 77.07, 80],
  [74.72, 75.89, 79],
  [73.54, 74.71, 78],
  [72.36, 73.53, 77],
  [71.18, 72.35, 76],
  [70.00, 71.17, 75],
  [65.34, 69.99, 74],
  [60.67, 65.33, 73],
  [56.01, 60.66, 72],
  [51.34, 56.00, 71],
  [46.67, 51.33, 70],
  [42.01, 46.66, 69],
  [37.34, 42.00, 68],
  [32.68, 37.33, 67],
  [28.01, 32.67, 66],
  [23.35, 28.00, 65],
  [18.68, 23.34, 64],
  [14.01, 18.67, 63],
  [9.35, 14.00, 62],
  [4.68, 9.34, 61],
  [0.00, 4.67, 60],
];
function transmute(initialGrade){
  if (initialGrade === null || initialGrade === undefined || isNaN(initialGrade)) return null;
  // Round here too (the "What if" simulator passes unrounded values), so a value like
  // 99.495 can never fall into the 0.01 gap between two ranges.
  const ig = Math.max(0, Math.min(100, Math.round(initialGrade * 100) / 100));
  for (const [lo, hi, t] of TRANSMUTATION_TABLE){
    if (ig >= lo && ig <= hi) return t;
  }
  return 60;
}

// ---------- Per-subject, per-term storage ----------
// Each (subject, term) combination gets its own settings + sections, saved
// under keys namespaced by both ids, so switching either dropdown never
// mixes data with another subject or another term.
function settingsKey(subjectId, termId){ return 'plg-settings-' + subjectId + '-' + termId; }
function sectionKey(subjectId, termId, idx){ return 'plg-section-' + subjectId + '-' + termId + '-' + idx; }

// One-time migration: earlier versions of this app stored data per subject
// only (no term). The first time this runs, any such legacy data is copied
// into that subject's Term 1 slot so nothing already entered gets lost.
function migrateLegacyData(){
  SUBJECTS.forEach(s => {
    try {
      const legacySettingsKey = 'plg-settings-' + s.id;
      const newSettingsKey = settingsKey(s.id, '1');
      if (!localStorage.getItem(newSettingsKey) && localStorage.getItem(legacySettingsKey)){
        localStorage.setItem(newSettingsKey, localStorage.getItem(legacySettingsKey));
      }
    } catch(e) {}
    for (let i = 1; i <= SECTION_COUNT; i++){
      try {
        const legacySecKey = 'plg-section-' + s.id + '-' + i;
        const newSecKey = sectionKey(s.id, '1', i);
        if (!localStorage.getItem(newSecKey) && localStorage.getItem(legacySecKey)){
          localStorage.setItem(newSecKey, localStorage.getItem(legacySecKey));
        }
      } catch(e) {}
    }
  });
}

async function loadState(){
  migrateLegacyData();
  try {
    const savedSubj = localStorage.getItem('plg-current-subject');
    if (savedSubj && SUBJECTS.some(s => s.id === savedSubj)) currentSubjectId = savedSubj;
  } catch(e) {}
  try {
    const savedTerm = localStorage.getItem('plg-current-term');
    if (savedTerm && TERMS.some(t => t.id === savedTerm)) currentTermId = savedTerm;
  } catch(e) {}
  loadSubjectTermData(currentSubjectId, currentTermId);
}

function loadSubjectTermData(subjectId, termId){
  try {
    const raw = localStorage.getItem(settingsKey(subjectId, termId));
    settings = raw ? Object.assign(defaultSettings(), JSON.parse(raw)) : defaultSettings();
  } catch(e) {
    settings = defaultSettings();
  }
  sections = [];
  for (let i = 1; i <= SECTION_COUNT; i++){
    try {
      const raw = localStorage.getItem(sectionKey(subjectId, termId, i));
      sections[i-1] = raw ? Object.assign(blankSection(i), JSON.parse(raw)) : blankSection(i);
    } catch(e) {
      sections[i-1] = blankSection(i);
    }
  }
}

function switchSubject(id){

function switchTerm(id){

let pendingSaves = {}; // keyed by "kind-idx" -> { kind, idx, subjectId, termId, settingsSnapshot, sectionSnapshot, timer }

function scheduleSave(kind, idx){
  const key = kind + '-' + (idx || '');
  if (pendingSaves[key]) clearTimeout(pendingSaves[key].timer);
  // Capture the subject/term this edit belongs to RIGHT NOW, along with a
  // snapshot of the data, so a subject/term switch before the timer fires
  // can't cause the save to land in the wrong slot (or be skipped entirely).
  const entry = {
    kind, idx,
    subjectId: currentSubjectId,
    termId: currentTermId,
    settingsSnapshot: kind === 'settings' ? JSON.parse(JSON.stringify(settings)) : null,
    sectionSnapshot: kind === 'section' ? JSON.parse(JSON.stringify(sections[idx-1])) : null
  };
  entry.timer = setTimeout(() => flushOneSave(key), 350);
  pendingSaves[key] = entry;
}

function flushOneSave(key){
  const p = pendingSaves[key];
  if (!p) return;
  delete pendingSaves[key];
  clearTimeout(p.timer);
  try {
    let sk = null, raw = null;
    if (p.kind === 'settings') {
      sk = settingsKey(p.subjectId, p.termId); raw = JSON.stringify(p.settingsSnapshot);
    } else if (p.kind === 'section') {
      sk = sectionKey(p.subjectId, p.termId, p.idx); raw = JSON.stringify(p.sectionSnapshot);
    }
    if (sk){
      const prevRaw = localStorage.getItem(sk);
      localStorage.setItem(sk, raw);
      syncNoteEdit(sk, raw, prevRaw);
      scheduleSync();
    }
  } catch(e) {
    console.error('Save failed', e);
    alert('Could not save your data in this browser. Your browser storage may be full or disabled (e.g. private/incognito mode).');
  }
}

// Immediately writes every save still waiting on its debounce timer. Must be
// called before switching subject/term, exporting a backup, or anything else
// that reads localStorage, so in-progress edits (including multi-section
// operations like roster copy) are never lost.
function flushPendingSave(){
  Object.keys(pendingSaves).forEach(flushOneSave);
}

// ---------- Rating logic ----------
function ratingFromFinalGrade(fg, subject){
  if (fg === null) return null;
  const th = getThresholds(subject);
  if (fg >= th.out) return 'out';
  if (fg >= th.sat) return 'sat';
  return 'imp';
}
function ratingLabel(code){
  return code === 'out' ? 'Outstanding' : code === 'sat' ? 'Satisfactory' : code === 'imp' ? 'Needs Improvement' : '\u2014';
}
function sumComponent(scores, maxArr){
  let sum = 0, maxSum = 0;
  scores.forEach((val, i) => {
    const max = Number(maxArr[i]);
    if (val !== "" && val !== null && !isNaN(Number(val)) && max > 0){
      sum += Number(val); maxSum += max;
    }
  });
  return { sum, maxSum, pct: maxSum > 0 ? (sum / maxSum * 100) : null };
}
// Returns labels (e.g. "WW2") for any assessment that has a highest-possible-score
// configured (meaning the task was actually given) but this student's score is
// still blank (meaning it wasn't submitted / recorded). An assessment with no
// max score set at all is treated as "not yet given" and is never flagged.
function missingLabels(scores, maxArr, prefix){
  const out = [];
  scores.forEach((val, i) => {
    const max = Number(maxArr[i]);
    const hasMax = maxArr[i] !== "" && maxArr[i] !== null && !isNaN(max) && max > 0;
    const isBlank = val === "" || val === null || val === undefined;
    if (hasMax && isBlank) out.push(prefix + (i+1));
  });
  return out;
}
// Combines Summative Test 1, Summative Test 2, and the Term Exam into a
// single Summative component. ST1 and ST2 each carry 30% of the Summative
// grade and the Term Exam carries the heavier 40%. Rather than pooling raw
// scores together, each of the three is scored as its own percentage and
// then combined using those sub-weights, renormalized across whichever of
// the three actually have a score entered so far -- so a partial-standing
// letter generated before the Term Exam is given still produces a correct,
// fully-weighted Summative grade (e.g. 50/50 between ST1 and ST2 if only
// those two exist yet), and it seamlessly becomes the full 30/30/40 formula
// the moment the Term Exam score is added.
function summativeComponent(student, sec){
  const items = [
    { score: student.summScores[0], max: sec.summMax[0], weight: SUMM_SUBWEIGHTS.st1, label: 'ST1' },
    { score: student.summScores[1], max: sec.summMax[1], weight: SUMM_SUBWEIGHTS.st2, label: 'ST2' },
    { score: student.teScore,       max: sec.teMax,       weight: SUMM_SUBWEIGHTS.te,  label: 'TE' }
  ];
  let sum = 0, maxSum = 0, weightedPctSum = 0, weightTotal = 0;
  const missing = [];
  items.forEach(it => {
    const max = Number(it.max);
    const hasMax = it.max !== "" && it.max !== null && !isNaN(max) && max > 0;
    const isBlank = it.score === "" || it.score === null || it.score === undefined;
    if (hasMax && isBlank) missing.push(it.label);
    if (hasMax && !isBlank && !isNaN(Number(it.score))){
      const score = Number(it.score);
      sum += score; maxSum += max;
      weightedPctSum += (score / max * 100) * it.weight;
      weightTotal += it.weight;
    }
  });
  const pct = weightTotal > 0 ? (weightedPctSum / weightTotal) : null;
  return { sum, maxSum, pct, missing };
}
function calcStudent(student, sec, subject){
  const weights = getWeights(subject);
  const ww = sumComponent(student.wwScores, sec.wwMax);
  const peta = sumComponent(student.petaScores, sec.petaMax);
  const summ = summativeComponent(student, sec);

  const wwMissing = missingLabels(student.wwScores, sec.wwMax, 'WW');
  const petaMissing = missingLabels(student.petaScores, sec.petaMax, 'PT');
  const summMissing = summ.missing;
  const missing = wwMissing.concat(petaMissing, summMissing);
  const hasMissing = missing.length > 0;

  let initialGrade = null;
  if (ww.pct !== null && peta.pct !== null && summ.pct !== null){
    initialGrade = ww.pct * weights.ww + peta.pct * weights.peta + summ.pct * weights.summ;
    // Round to 2 decimal places to avoid floating-point precision gaps in transmutation ranges
    // e.g., 84.9909... should become 84.99, not fall into a gap between 84.99 and 85.00
    initialGrade = Math.round(initialGrade * 100) / 100;
  }
  const finalGrade = transmute(initialGrade);
  let overallRating = ratingFromFinalGrade(finalGrade, subject);
  // A missing (ungraded) task always means Needs Improvement, regardless of
  // how well the student scored on the tasks that were completed, since the
  // parent needs to know a requirement is outstanding.
  if (hasMissing) overallRating = 'imp';

  return {
    ww, peta, summ,
    initialGrade, finalGrade, overallRating, weights,
    wwMissing, petaMissing, summMissing, missing, hasMissing
  };
}
function fmtPct(p){ return p === null ? "\u2014" : p.toFixed(1) + "%"; }
function fmtFrac(c){ return c.maxSum > 0 ? (c.sum + " / " + c.maxSum) : "\u2014"; }
function fmtGrade(g){ return g === null ? "\u2014" : g; }
function fmtWeight(w){ return Math.round(w * 100) + "%"; }

function applyDefaultsToSections(){
  const wwmax = Array.from({length:WW_COUNT}, (_,i) => settings['wwmax'+i] || "");
  const petamax = Array.from({length:PETA_COUNT}, (_,i) => settings['petamax'+i] || "");
  const smax = Array.from({length:SUMM_COUNT}, (_,i) => settings['smax'+i] || "");
  const temax = settings['temax'] || "";
  for (let i=1;i<=SECTION_COUNT;i++){
    sections[i-1].wwMax = wwmax.slice();
    sections[i-1].petaMax = petamax.slice();
    sections[i-1].summMax = smax.slice();
    sections[i-1].teMax = temax;
    scheduleSave('section', i);
  }
  render();
}

function copyRosterFromTerm(sourceTermId){
  if (!sourceTermId || sourceTermId === currentTermId) return;
  flushPendingSave();
  const sourceTerm = getTerm(sourceTermId);
  const hasExistingNames = sections.some(sec => sec.students.some(s => s.name && s.name.trim()));
  if (hasExistingNames && !confirm('This will overwrite section names and student names currently in ' + getTerm(currentTermId).label + ' for this subject with the roster from ' + sourceTerm.label + '. Scores will stay blank either way. Continue?')) return;

  let foundAny = false;
  for (let i = 1; i <= SECTION_COUNT; i++){
    let sourceSec = null;
    try {
      const raw = localStorage.getItem(sectionKey(currentSubjectId, sourceTermId, i));
      sourceSec = raw ? JSON.parse(raw) : null;
    } catch(e) { sourceSec = null; }
    if (!sourceSec) continue;
    foundAny = true;
    sections[i-1].name = sourceSec.name || sections[i-1].name;
    const sourceStudents = Array.isArray(sourceSec.students) ? sourceSec.students : [];
    for (let si = 0; si < STUDENTS_PER_SECTION; si++){
      sections[i-1].students[si].name = (sourceStudents[si] && sourceStudents[si].name) ? sourceStudents[si].name : "";
      // Scores intentionally left blank for the new term.
    }
    scheduleSave('section', i);
  }
  if (!foundAny){
    alert(sourceTerm.label + ' has no saved data yet for ' + getSubject(currentSubjectId).label + ', so there was nothing to copy.');
    return;
  }
  renderNav();
  render();
}

// ---------- Paste-from-Excel helpers ----------
// Names: one per line. Scores: one or more tab-separated columns per line,
// mapped in order onto the component's sub-item columns (WW1, WW2, ... etc).
function pasteNamesInto(sec, raw){
  const names = raw.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
  if (names.length === 0){ alert('Paste at least one name first.'); return false; }
  const truncated = names.length > STUDENTS_PER_SECTION;
  const useNames = names.slice(0, STUDENTS_PER_SECTION);
  const hasExisting = sec.students.slice(0, useNames.length).some(s => s.name && s.name.trim());
  if (hasExisting && !confirm('This will overwrite names already entered in the first ' + useNames.length + ' row(s) of this section. Continue?')) return false;
  useNames.forEach((name, i) => { sec.students[i].name = name; });
  if (truncated) alert('This section only has ' + STUDENTS_PER_SECTION + ' student slots, so only the first ' + STUDENTS_PER_SECTION + ' names were used.');
  return true;
}

const PASTE_COMPONENT_META = {
  ww:   { count: WW_COUNT,   arr: 'wwScores',   label: 'Written Works (WW)' },
  peta: { count: PETA_COUNT, arr: 'petaScores', label: 'Performance Task (PETA)' },
  s:    { count: SUMM_COUNT, arr: 'summScores', label: 'Summative Test' },
  te:   { count: 1,          arr: 'teScore',    label: 'Term Exam', single: true }
};
function pasteScoresInto(sec, target, raw, startCol){
  const meta = PASTE_COMPONENT_META[target];
  let lines = raw.split(/\r?\n/);
  while (lines.length && lines[lines.length-1].trim() === '') lines.pop();
  if (lines.length === 0){ alert('Paste at least one row of scores first.'); return false; }
  const truncated = lines.length > STUDENTS_PER_SECTION;
  const rows = lines.slice(0, STUDENTS_PER_SECTION);

  // Term Exam is a single score per student (not an array of sub-items),
  // so it's pasted as one column regardless of the Starting column control.
  if (meta.single){
    const hasExisting = sec.students.slice(0, rows.length).some(s => s[meta.arr] !== '' && s[meta.arr] !== null && s[meta.arr] !== undefined);
    if (hasExisting && !confirm('This will overwrite existing ' + meta.label + ' scores in the first ' + rows.length + ' row(s) of this section. Continue?')) return false;
    rows.forEach((line, ri) => {
      const cell = line.split('\t')[0].trim();
      if (cell !== '') sec.students[ri][meta.arr] = cell;
    });
    if (truncated) alert('This section only has ' + STUDENTS_PER_SECTION + ' student slots, so only the first ' + STUDENTS_PER_SECTION + ' rows were used.');
    return true;
  }

  const startIdx = Math.max(0, Math.min(meta.count - 1, (Number(startCol) || 1) - 1));
  const hasExisting = sec.students.slice(0, rows.length).some(s => s[meta.arr].slice(startIdx).some(v => v !== '' && v !== null && v !== undefined));
  if (hasExisting && !confirm('This will overwrite existing ' + meta.label + ' scores (starting at column ' + (startIdx+1) + ') in the first ' + rows.length + ' row(s) of this section. Continue?')) return false;
  rows.forEach((line, ri) => {
    const cells = line.split('\t').map(c => c.trim());
    for (let ci=0; ci<cells.length; ci++){
      const targetIdx = startIdx + ci;
      if (targetIdx >= meta.count) break;
      if (cells[ci] !== '') sec.students[ri][meta.arr][targetIdx] = cells[ci];
    }
  });
  if (truncated) alert('This section only has ' + STUDENTS_PER_SECTION + ' student slots, so only the first ' + STUDENTS_PER_SECTION + ' rows were used.');
  return true;
}

// ---------- Spreadsheet-style score grid ----------
// Grid coordinates: r = 0 is the "Highest Possible Score" row, r = 1..35 are students.
// c = 0 is the student name, then WW, PT, S and TE columns in order.
const GRID_COLS = 1 + WW_COUNT + PETA_COUNT + SUMM_COUNT + 1; // name + WW + PT + S + TE
const ENTRY_TAB = {};    // section index -> 'manual' | 'paste' | 'upload'
const UPLOAD_STATE = {}; // section index -> parsed Excel file state
const UNDO_STACK = {};   // "subject|term|section" -> [json snapshots]
function colField(c){
  if (c >= 1 && c <= WW_COUNT) return { f: 'ww', i: c - 1 };
  c -= WW_COUNT;
  if (c >= 1 && c <= PETA_COUNT) return { f: 'peta', i: c - 1 };
  c -= PETA_COUNT;
  if (c >= 1 && c <= SUMM_COUNT) return { f: 's', i: c - 1 };
  return { f: 'te' };
}
function colLabel(c){
  const t = colField(c);
  return c === 0 ? 'Name' : t.f === 'ww' ? 'WW' + (t.i + 1) : t.f === 'peta' ? 'PT' + (t.i + 1) : t.f === 's' ? 'S' + (t.i + 1) : 'TE';
}
function sheetGet(sec, r, c){
  if (c === 0) return r === 0 ? '' : sec.students[r-1].name;
  const t = colField(c);
  if (r === 0) return t.f === 'ww' ? sec.wwMax[t.i] : t.f === 'peta' ? sec.petaMax[t.i] : t.f === 's' ? sec.summMax[t.i] : sec.teMax;
  const stu = sec.students[r-1];
  return t.f === 'ww' ? stu.wwScores[t.i] : t.f === 'peta' ? stu.petaScores[t.i] : t.f === 's' ? stu.summScores[t.i] : stu.teScore;
}
function sheetSet(sec, r, c, v){
  if (c === 0){ if (r > 0) sec.students[r-1].name = v; return; }
  const t = colField(c);
  if (r === 0){
    if (t.f === 'ww') sec.wwMax[t.i] = v; else if (t.f === 'peta') sec.petaMax[t.i] = v;
    else if (t.f === 's') sec.summMax[t.i] = v; else sec.teMax = v;
    return;
  }
  const stu = sec.students[r-1];
  if (t.f === 'ww') stu.wwScores[t.i] = v; else if (t.f === 'peta') stu.petaScores[t.i] = v;
  else if (t.f === 's') stu.summScores[t.i] = v; else stu.teScore = v;
}
function cleanScore(v){
  const s = String(v == null ? '' : v).trim().replace(/,/g, '');
  return /^\d*\.?\d+$/.test(s) ? s : null;
}
function undoKey(idx){ return currentSubjectId + '|' + currentTermId + '|' + idx; }
function pushUndo(idx){
  const k = undoKey(idx);
  (UNDO_STACK[k] = UNDO_STACK[k] || []).push(JSON.stringify(sections[idx-1]));
  if (UNDO_STACK[k].length > 15) UNDO_STACK[k].shift();
}
function undoCount(idx){ return (UNDO_STACK[undoKey(idx)] || []).length; }
function popUndo(idx){
  const st = UNDO_STACK[undoKey(idx)];
  if (!st || !st.length) return false;
  try { sections[idx-1] = Object.assign(blankSection(idx), JSON.parse(st.pop())); } catch(e) { return false; }
  scheduleSave('section', idx);
  return true;
}

// Makes the header rows stick to the top of the scrolling grid (each row sits just under the one above it).
function stickHead(table){
  let top = 0;
  table.querySelectorAll('thead tr').forEach(tr => {
    tr.querySelectorAll('th').forEach(th => { th.style.top = top + 'px'; });
    top += tr.getBoundingClientRect().height;
  });
}

// Spreadsheet behaviour for the grid: arrow keys, Enter, drag-select, copy / cut / delete a block,
// and pasting a block straight from Excel. All grid inputs carry data-r / data-c.
function attachSheet(table, tbody, sec, secIdx, subject, afterBulk){
  const CELL = 'input[data-cell]';
  const grid = [];
  table.querySelectorAll(CELL).forEach(el => {
    const r = +el.dataset.r, c = +el.dataset.c;
    (grid[r] = grid[r] || [])[c] = el;
  });
  const rowCount = sec.students.length + 1;
  let sel = null, dragging = false;
  const norm = s => ({ r1: Math.min(s.r1, s.r2), r2: Math.max(s.r1, s.r2), c1: Math.min(s.c1, s.c2), c2: Math.max(s.c1, s.c2) });
  const isMulti = s => s && (s.r1 !== s.r2 || s.c1 !== s.c2);
  function paint(){
    table.querySelectorAll('input.plg-cell-sel').forEach(el => el.classList.remove('plg-cell-sel'));
    if (!isMulti(sel)) return;
    const n = norm(sel);
    for (let r = n.r1; r <= n.r2; r++) for (let c = n.c1; c <= n.c2; c++) if (grid[r] && grid[r][c]) grid[r][c].classList.add('plg-cell-sel');
  }
  function setSel(s){ sel = s; paint(); }
  function posOf(el){ return { r: +el.dataset.r, c: +el.dataset.c }; }
  function focusCell(r, c, dr, dc){
    // skip over missing cells (the name column has no cell in the HPS row)
    for (let k = 0; k < 3; k++){
      if (r < 0 || r >= rowCount || c < 0 || c >= GRID_COLS) return;
      const el = grid[r] && grid[r][c];
      if (el){ el.focus(); if (el.select) el.select(); return; }
      r += dr; c += dc;
      if (!dr && !dc) return;
    }
  }
  function updateStats(r){
    if (r === 0) updateAllRowStats(tbody, sec, subject);
    else updateRowStats(tbody, r - 1, sec, subject);
  }
  // write many cells at once (one save, one stats refresh)
  function bulkSet(cells){
    if (!cells.length) return;
    pushUndo(secIdx);
    const rows = new Set();
    cells.forEach(x => { sheetSet(sec, x.r, x.c, x.v); const el = grid[x.r] && grid[x.r][x.c]; if (el) el.value = x.v; rows.add(x.r); });
    scheduleSave('section', secIdx);
    if (rows.has(0)) updateAllRowStats(tbody, sec, subject); else rows.forEach(updateStats);
    if (afterBulk) afterBulk();
  }
  function rangeCells(s){
    const n = norm(s), out = [];
    for (let r = n.r1; r <= n.r2; r++) for (let c = n.c1; c <= n.c2; c++) if (grid[r] && grid[r][c]) out.push({ r, c });
    return out;
  }
  function rangeText(s){
    const n = norm(s), lines = [];
    for (let r = n.r1; r <= n.r2; r++){
      const cells = [];
      for (let c = n.c1; c <= n.c2; c++) cells.push(grid[r] && grid[r][c] ? grid[r][c].value : '');
      lines.push(cells.join('\t'));
    }
    return lines.join('\n');
  }

  // typing in one cell
  table.addEventListener('input', e => {
    const el = e.target;
    if (!el.matches || !el.matches(CELL)) return;
    const p = posOf(el);
    sheetSet(sec, p.r, p.c, el.value);
    scheduleSave('section', secIdx);
    updateStats(p.r);
  });

  // drag to select a block of cells
  table.addEventListener('mousedown', e => {
    const el = e.target;
    if (!el.matches || !el.matches(CELL)) { return; }
    const p = posOf(el);
    dragging = true;
    setSel({ r1: p.r, c1: p.c, r2: p.r, c2: p.c });
  });
  function onMove(e){
    if (!table.isConnected){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); return; }
    if (!dragging) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.matches || !el.matches(CELL) || !table.contains(el)) return;
    const p = posOf(el);
    if (sel && sel.r2 === p.r && sel.c2 === p.c) return;
    setSel({ r1: sel.r1, c1: sel.c1, r2: p.r, c2: p.c });
    const g = window.getSelection && window.getSelection(); if (g && g.removeAllRanges) g.removeAllRanges();
  }
  function onUp(){ dragging = false; }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  // keyboard
  table.addEventListener('keydown', e => {
    const el = e.target;
    if (!el.matches || !el.matches(CELL)) return;
    const p = posOf(el);
    if ((e.key === 'Delete' || e.key === 'Backspace') && isMulti(sel)){
      e.preventDefault();
      bulkSet(rangeCells(sel).map(x => ({ r: x.r, c: x.c, v: '' })));
      return;
    }
    let dr = 0, dc = 0;
    if (e.key === 'Enter') dr = e.shiftKey ? -1 : 1;
    else if (e.key === 'ArrowDown') dr = 1;
    else if (e.key === 'ArrowUp') dr = -1;
    else if (e.key === 'ArrowLeft' && el.type === 'number') dc = -1;
    else if (e.key === 'ArrowRight' && el.type === 'number') dc = 1;
    else return;
    e.preventDefault();
    setSel(null);
    focusCell(p.r + dr, p.c + dc, dr, dc);
  });
  table.addEventListener('focusin', e => {
    if (!dragging && e.target.matches && e.target.matches(CELL) && sel && isMulti(sel) && !(e.target.classList.contains('plg-cell-sel'))) setSel(null);
  });

  // copy / cut a block
  function copyOrCut(e, cut){
    if (!isMulti(sel)) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', rangeText(sel));
    if (cut) bulkSet(rangeCells(sel).map(x => ({ r: x.r, c: x.c, v: '' })));
  }
  table.addEventListener('copy', e => copyOrCut(e, false));
  table.addEventListener('cut', e => copyOrCut(e, true));

  // paste a block copied from Excel (tabs between columns, new lines between rows)
  table.addEventListener('paste', e => {
    const el = e.target;
    if (!el.matches || !el.matches(CELL)) return;
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!text || (text.indexOf('\t') < 0 && text.indexOf('\n') < 0)) return; // single value: normal paste
    e.preventDefault();
    const start = isMulti(sel) ? { r: norm(sel).r1, c: norm(sel).c1 } : posOf(el);
    const lines = text.replace(/\r/g, '').split('\n');
    while (lines.length && lines[lines.length-1] === '') lines.pop();
    const cells = [];
    let skipped = 0;
    lines.forEach((line, i) => {
      line.split('\t').forEach((raw, j) => {
        const r = start.r + i, c = start.c + j;
        if (r >= rowCount || c >= GRID_COLS || !(grid[r] && grid[r][c])) return;
        const val = raw.trim();
        if (c === 0){ if (val !== '') cells.push({ r, c, v: val }); return; }
        if (val === '') return;
        const num = cleanScore(val);
        if (num === null){ skipped++; return; }
        cells.push({ r, c, v: num });
      });
    });
    bulkSet(cells);
    if (skipped) showToast(skipped + ' pasted cell(s) were not numbers and were skipped.');
    else showToast('Pasted ' + cells.length + ' cell(s). You can undo this.');
  });
  return { bulkSet };
}

// ---------- Upload the Excel grading sheet (ECR) ----------
// Reads the same ECR layout as the staff portal importer: a sheet per term, a "HIGHEST POSSIBLE SCORE" row,
// MALE / FEMALE sections, names in column C, WW in F-J, PT in N-P, and S1 / S2 / TE in T-V.
// Every column can be changed on screen before anything is applied.
function ensureXLSX(){
  if (window.XLSX) return true;
  try {
    const el = document.getElementById('plg-xlsx-src');
    if (el) (0, eval)(el.textContent);
  } catch(e) { console.error('Excel reader failed to start', e); }
  return !!window.XLSX;
}
function xlColName(i){ let s = ''; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
// target keys: WW1..WW8, PT1..PT5, S1, S2, TE  (index 1..16 in the grid)
const ECR_DEFAULT_COLS = { 1:5, 2:6, 3:7, 4:8, 5:9,   9:13, 10:14, 11:15,   14:19, 15:20, 16:21 };
function ecrDefaultMapping(){
  const m = {};
  for (let c = 1; c < GRID_COLS; c++) m[c] = ECR_DEFAULT_COLS[c] !== undefined ? ECR_DEFAULT_COLS[c] : -1;
  return m;
}
const ecrTxt = v => String(v == null ? '' : v).trim();
function ecrAnalyze(ws, nameColOverride){
  const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
  let hpsRow = -1;
  for (let r = 0; r < data.length && hpsRow < 0; r++){
    const row = data[r] || [];
    for (let c = 0; c < row.length; c++) if (/HIGHEST\s+POSSIBLE\s+SCORE/i.test(ecrTxt(row[c]))){ hpsRow = r; break; }
  }
  const isLabel = (row, lab) => (row || []).slice(0, 5).some(v => ecrTxt(v).toUpperCase() === lab);
  let maleRow = -1;
  data.forEach((row, r) => { if (maleRow < 0 && isLabel(row, 'MALE')) maleRow = r; });
  if (hpsRow < 0 && maleRow < 0) return { data, error: 'This does not look like the ECR layout: I could not find a "HIGHEST POSSIBLE SCORE" row or a "MALE" row.' };
  const startRow = hpsRow >= 0 ? hpsRow + 1 : maleRow + 1;
  const looksLikeName = s => s && !/^[\d.\s,%\-]+$/.test(s) && !/^(male|female)$/i.test(s) && !/^(total|average|mean|passing|number)\b/i.test(s);
  // name column: column C (as in the ECR) unless it holds no names and another column clearly does
  const countNames = c => { let n = 0; for (let r = startRow; r < data.length; r++) if (looksLikeName(ecrTxt((data[r] || [])[c]))) n++; return n; };
  let nameCol = 2;
  if (nameColOverride !== undefined && nameColOverride !== null) nameCol = nameColOverride;
  else if (countNames(2) === 0){
    let bestN = 0;
    for (let c = 0; c < 8; c++){ const n = countNames(c); if (n > bestN){ bestN = n; nameCol = c; } }
  }
  const rows = [];
  let sex = '';
  for (let r = startRow; r < data.length; r++){
    const row = data[r] || [];
    if (isLabel(row, 'MALE')){ sex = 'M'; continue; }
    if (isLabel(row, 'FEMALE')){ sex = 'F'; continue; }
    const name = ecrTxt(row[nameCol]);
    if (/^(prepared|checked|noted|attested|approved|certified)\b/i.test(name)) break;
    if (!looksLikeName(name)) continue;
    rows.push({ r, name, sex });
  }
  const width = Math.max(26, data.reduce((m, row) => Math.max(m, (row || []).length), 0));
  return { data, hpsRow, nameCol, rows, width };
}
function ecrNameKey(name){
  const toks = String(name).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(t => t.length > 1);
  return new Set(toks);
}
function ecrJaccard(a, b){
  if (!a.size || !b.size) return 0;
  let i = 0; a.forEach(t => { if (b.has(t)) i++; });
  return i / (a.size + b.size - i);
}
function ecrTitle(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }
function ecrDisplayName(name, style){
  let n = name.replace(/\s+/g, ' ').trim();
  if (style === 'given'){
    const i = n.indexOf(',');
    if (i > 0) n = (n.slice(i + 1).trim() + ' ' + n.slice(0, i).trim()).trim();
    n = n.split(' ').map(w => (w === w.toUpperCase() && /[A-Z]{2,}/.test(w)) ? ecrTitle(w) : w).join(' ');
  }
  return n;
}
function stuIsEmpty(stu){
  return !(stu.name && stu.name.trim()) && ![].concat(stu.wwScores, stu.petaScores, stu.summScores, [stu.teScore]).some(v => v !== '' && v != null);
}
function ecrPlan(sec, st){
  const used = new Set();
  const existing = sec.students.map((s, i) => ({ i, key: ecrNameKey(s.name || '') }));
  const plan = st.analysis.rows.map(row => {
    const shown = ecrDisplayName(row.name, st.nameStyle);
    const k = ecrNameKey(shown);
    let best = -1, bs = 0;
    existing.forEach(e => { if (used.has(e.i) || !e.key.size) return; const s = ecrJaccard(k, e.key); if (s > bs){ bs = s; best = e.i; } });
    if (bs >= 0.75){ used.add(best); return { row, shown, slot: best, kind: 'match' }; }
    return { row, shown, slot: -1, kind: 'new' };
  });
  const empties = sec.students.map((s, i) => i).filter(i => !used.has(i) && stuIsEmpty(sec.students[i]));
  plan.forEach(p => {
    if (p.kind !== 'new') return;
    if (empties.length){ p.slot = empties.shift(); } else { p.kind = 'full'; }
  });
  return plan;
}
function ecrScore(v){
  if (typeof v === 'number' && isFinite(v)) return String(Math.round(v * 100) / 100);
  const s = cleanScore(v);
  return s === null ? null : String(Math.round(parseFloat(s) * 100) / 100);
}
function ecrApply(sec, st){
  const plan = ecrPlan(sec, st);
  const data = st.analysis.data;
  let students = 0, added = 0, scores = 0, ignored = 0, maxes = 0, full = 0;
  if (st.setHps && st.analysis.hpsRow >= 0){
    for (let c = 1; c < GRID_COLS; c++){
      const col = st.mapping[c]; if (col < 0) continue;
      const v = ecrScore((data[st.analysis.hpsRow] || [])[col]);
      if (v !== null && parseFloat(v) > 0){ sheetSet(sec, 0, c, v); maxes++; }
    }
  }
  plan.forEach(p => {
    if (p.kind === 'full'){ full++; return; }
    students++;
    if (p.kind === 'new'){ sec.students[p.slot].name = p.shown; added++; }
    for (let c = 1; c < GRID_COLS; c++){
      const col = st.mapping[c]; if (col < 0) continue;
      const raw = (data[p.row.r] || [])[col];
      if (raw === '' || raw == null) continue;
      const v = ecrScore(raw);
      if (v === null){ ignored++; continue; }
      sheetSet(sec, p.slot + 1, c, v); scores++;
    }
  });
  return { students, added, scores, ignored, maxes, full };
}
function ecrPickSheet(wb){
  const label = getTerm(currentTermId).label.toUpperCase();
  const names = wb.SheetNames;
  return names.find(n => n.trim().toUpperCase() === label)
      || names.find(n => n.toUpperCase().indexOf(label) >= 0)
      || names.find(n => new RegExp('(^|\\D)' + currentTermId + '(\\D|$)').test(n) && /term|q|quarter/i.test(n))
      || names[0];
}
function ecrAnalyzeSheet(st){
  st.analysis = ecrAnalyze(st.wb.Sheets[st.sheet], st.nameColOverride);
  st.mapping = st.mapping || ecrDefaultMapping();
}

  if (st.wb && st.analysis && !st.analysis.error){

    </div>`;

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">`;
    for (let c = 1; c < GRID_COLS; c++){

  const tbody = document.createElement('tbody');
  sec.students.forEach((stu, si) => {
    const tr = document.createElement('tr');
    let row = `<td class="plg-name-cell">${dataCell(si + 1, 0, stu.name, ` placeholder="Student ${si+1}"`)}</td>`;
    for (let c = 1; c < GRID_COLS; c++) row += `<td class="plg-c">${dataCell(si + 1, c, sheetGet(sec, si + 1, c), ' class="plg-score"')}</td>`;
    const hasName = !!(stu.name && stu.name.trim());
    const c = calcStudent(stu, sec, subject);
    if (hasName){
      row += `<td>${fmtFrac(c.ww)}</td><td>${fmtFrac(c.peta)}</td><td>${fmtFrac(c.summ)}</td>`;
      row += `<td>${c.initialGrade===null?'\u2014':c.initialGrade.toFixed(1)+'%'}</td><td>${fmtGrade(c.finalGrade)}</td>`;
      row += `<td>${c.overallRating ? `<span class="plg-badge ${c.overallRating}">${ratingLabel(c.overallRating)}</span>${c.hasMissing ? ` <span title="Missing: ${c.missing.join(', ')}" style="color:#b42318;font-size:11px;">&#9888; ${c.missing.join(', ')}</span>` : ''}` : `<span class="plg-badge none">\u2014</span>`}</td>`;
    } else {
      row += `<td>\u2014</td><td>\u2014</td><td>\u2014</td><td>\u2014</td><td>\u2014</td><td><span class="plg-badge none">\u2014</span></td>`;
    }
    tr.innerHTML = row;
    tr.innerHTML = row;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  manual.appendChild(wrap);
  container.appendChild(card);
  if (curTab === 'manual') stickHead(table);

  // clear one whole column (or all names); the Highest Possible Score box is left alone
  table.querySelectorAll('.plg-col-clear').forEach(btn => {
    btn.onclick = () => {
      const col = btn.dataset.clearcol;
      const idx = btn.dataset.clearidx !== undefined ? Number(btn.dataset.clearidx) : null;
      if (col === 'name'){
        if (!confirm('Clear all student names for this section? Any scores already entered will remain, but rows will become blank/unnamed until new names are entered.')) return;
        pushUndo(secIdx);
        sec.students.forEach(stu => { stu.name = ''; });
        scheduleSave('section', secIdx);
        render();
        return;
      }
      const label = btn.title.replace('Clear ', '').replace(' for all students', '');
      if (!confirm(`Clear all student scores in the ${label} column for this section? The Highest Possible Score box will be left as is.`)) return;
      pushUndo(secIdx);
      sec.students.forEach(stu => {
        if (col === 'ww') stu.wwScores[idx] = '';
        else if (col === 'peta') stu.petaScores[idx] = '';
        else if (col === 's') stu.summScores[idx] = '';
        else if (col === 'te') stu.teScore = '';
      });
      scheduleSave('section', secIdx);
      render();
    };
  });
  attachSheet(table, tbody, sec, secIdx, subject, syncUndo);
}

function updateRowStats(tbody, si, sec, subject){
  const tr = tbody.children[si];

    tds[tds.length-4].textContent = '\u2014';
    tds[tds.length-3].textContent = '\u2014';
    tds[tds.length-2].textContent = '\u2014';

}
function updateAllRowStats(tbody, sec, subject){

// ---------- Rendering: individual student scores (single-student, parent-safe view) ----------
function getSectionDataForTerm(termId, idx){
  // Reads a section's data for any term without disturbing the app's current
  // subject/term state. If it's the term currently loaded in memory, use
  // that (after flushing any pending debounced edits so it's up to date);
  // otherwise read straight from storage, same approach used by the roster
  // copy helpers above.
  flushPendingSave();
  if (termId === currentTermId) return sections[idx-1];
  try {
    const raw = localStorage.getItem(sectionKey(currentSubjectId, termId, idx));
    return raw ? Object.assign(blankSection(idx), JSON.parse(raw)) : blankSection(idx);
  } catch(e) {
    return blankSection(idx);
  }
}

  sectionSel.onchange = e => { state.sectionIdx = Number(e.target.value); state.studentIdx = null; populateStudents(); renderResult(); };
  studentSel.onchange = e => { state.studentIdx = e.target.value ? Number(e.target.value) : null; renderResult(); };
}

// ---------- "What if" grade simulator ----------
// Lets the teacher drag sliders to add hypothetical extra points onto each
// component's already-earned total (never above its Highest Possible Score)
// and see, live, how the Initial Grade / Final Grade / Rating would change.
// This never writes to the student's saved scores \u2014 it's purely a live
// what-if calculation for the currently displayed student.
function renderSimulator(container, sec, subject, c){
  const weights = c.weights;
  const scard = document.createElement('div'); scard.className = 'plg-card no-print';
  scard.innerHTML = `<h2>What If? Grade Simulator</h2><p class="plg-sub">Drag a slider to see how many additional points in that component would change the Initial Grade, Final Grade, and Rating &mdash; a quick way to show a parent what's needed to reach the next level. Nothing here is saved.</p>`;

  const components = [
    { key: 'ww',   label: 'Written Works (WW)',              data: c.ww,   weight: weights.ww },
    { key: 'peta', label: 'Performance Tasks (PT)',           data: c.peta, weight: weights.peta },
    { key: 'summ', label: 'Summative Test / Term Exam',       data: c.summ, weight: weights.summ },
  ];

  components.forEach(comp => {
    const remaining = Math.max(0, comp.data.maxSum - comp.data.sum);
    const row = document.createElement('div'); row.className = 'plg-field';
    row.innerHTML = `
      <label>${comp.label} &mdash; add points (currently ${comp.data.maxSum ? comp.data.sum : '\u2014'} / ${comp.data.maxSum || '\u2014'})</label>
      <div style="display:flex;align-items:center;gap:10px;max-width:440px;">
        <input type="range" min="0" max="${remaining}" value="0" step="1" data-sim="${comp.key}" style="flex:1;" ${remaining <= 0 ? 'disabled' : ''}>
        <span id="plg-sim-val-${comp.key}" style="min-width:38px;text-align:right;font-weight:600;color:var(--navy);">+0</span>
      </div>
    `;
    scard.appendChild(row);
  });

  const resultBox = document.createElement('div');
  resultBox.style.cssText = 'border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:6px; background:var(--soft);';
  scard.appendChild(resultBox);
  container.appendChild(scard);

  function recompute(){
    const details = components.map(comp => {
      const slider = scard.querySelector(`[data-sim="${comp.key}"]`);
      const delta = Number(slider.value) || 0;
      const simSum = comp.data.sum + delta;
      const pct = comp.data.maxSum > 0 ? (simSum / comp.data.maxSum * 100) : null;
      scard.querySelector(`#plg-sim-val-${comp.key}`).textContent = '+' + delta;
      return Object.assign({}, comp, { delta, simSum, pct });
    });
    let ig = null;
    if (details.every(d => d.pct !== null)) ig = details.reduce((acc, d) => acc + d.pct * d.weight, 0);
    const fg = transmute(ig);
    const rating = ratingFromFinalGrade(fg, subject);
    resultBox.innerHTML = `
      <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
        <div><strong>Simulated Initial Grade:</strong> ${ig === null ? '\u2014' : ig.toFixed(1) + '%'}</div>
        <div><strong>Simulated Final Grade:</strong> ${fmtGrade(fg)}</div>
        <div><strong>Simulated Rating:</strong> ${rating ? `<span class="plg-badge ${rating}">${ratingLabel(rating)}</span>` : '<span class="plg-badge none">\u2014</span>'}</div>
      </div>
    `;
  }

  scard.querySelectorAll('[data-sim]').forEach(inp => { inp.oninput = recompute; });
  recompute();
}

function generateLetters(scope, ratingFilter, detailLevel){
  const subject = getSubject(currentSubjectId);
  const detail = detailLevel || settings.detailLevel || 'full';
  let html = "";
  let count = 0;
  const secList = scope === 'all' ? sections.map((s,i)=>({s, i:i+1})) : [{s: sections[Number(scope)-1], i: Number(scope)}];
  secList.forEach(({s: sec}) => {
    sec.students.forEach(stu => {
      if (!stu.name || !stu.name.trim()) return;
      const c = calcStudent(stu, sec, subject);
      if (!c.overallRating) return;
      if (ratingFilter && ratingFilter !== 'all' && c.overallRating !== ratingFilter) return;
      html += buildLetterHTML(stu, sec, c, subject, detail);
      count++;
    });
  });
  window.__plgLastGenerated = html || `<p class="plg-empty-note">No students matching this scope and rating filter were found.</p>`;
  window.__plgLastCount = count;
  render();
}

    : `<p>In order to better support <strong>${name}</strong>'s learning, we kindly request you to come to school for a short conference to discuss his/her progress and the ways we can work together to help him/her improve. Please see the schedule below:</p>

         <strong>Place:</strong> ${settings.meetingPlace ? escapeHtml(settings.meetingPlace) : '________________________________________________'}
       </div>`;

  const overallLabel = ratingLabel(rating);
  const wwLabel = 'Written Works (WW) &ndash; ' + fmtWeight(w.ww) + (c.wwMissing.length ? `<span class="plg-comp-missing">Missing: ${c.wwMissing.join(', ')}</span>` : '');
  const petaLabel = 'Performance Tasks (PETA) &ndash; ' + fmtWeight(w.peta) + (c.petaMissing.length ? `<span class="plg-comp-missing">Missing: ${c.petaMissing.join(', ')}</span>` : '');

    <div class="plg-letter-head">
      <img src="${LOGO_SRC}" alt="logo">

function resetAllData(){
  flushPendingSave();
  const syncNote = syncMeta.uid ? '\n\nThis only clears THIS device. Your Google Drive copy is not deleted, and sync will be switched off on this device.' : '';
  const typed = prompt('This will permanently erase all subjects, terms, sections, students, and scores in this browser.\n\nIf you want to keep this year\'s data, click Cancel and use "Download backup" first.' + syncNote + '\n\nType RESET (all caps) to confirm you want to start fresh:');
  if (typed !== 'RESET') {
    if (typed !== null) alert('Reset cancelled \u2014 the text didn\'t match "RESET".');
    return;
  }
  try {
    SUBJECTS.forEach(s => {
      localStorage.removeItem('plg-settings-' + s.id); // legacy (pre-term) key
      for (let i = 1; i <= SECTION_COUNT; i++) localStorage.removeItem('plg-section-' + s.id + '-' + i); // legacy
      TERMS.forEach(t => {
        localStorage.removeItem(settingsKey(s.id, t.id));
        for (let i = 1; i <= SECTION_COUNT; i++) localStorage.removeItem(sectionKey(s.id, t.id, i));
      });
    });
    localStorage.removeItem('plg-current-subject');
    localStorage.removeItem('plg-current-term');
  } catch(e) {}
  clearTimeout(syncTimer);
  syncMeta = { on: false, uid: '', last: 0, err: '', items: {} };
  saveSyncMeta(); setSync(null);
  currentSubjectId = SUBJECTS[0].id;
  currentTermId = TERMS[0].id;
  settings = defaultSettings();
  sections = Array.from({length: SECTION_COUNT}, (_, i) => blankSection(i+1));
  window.__plgLastGenerated = null;
  window.__plgLastCount = 0;
  currentView = 'setup';
  alert('All data has been cleared. You\'re ready to start entering your new class.');
  render();
}

function exportBackup(){
  flushPendingSave();
  const payload = { currentSubject: currentSubjectId, currentTerm: currentTermId, subjects: {}, exportedAt: new Date().toISOString() };
  SUBJECTS.forEach(s => {
    const termsPayload = {};
    TERMS.forEach(t => {
      let termSettings = null;
      try { const raw = localStorage.getItem(settingsKey(s.id, t.id)); termSettings = raw ? JSON.parse(raw) : null; } catch(e) {}
      const secs = [];
      for (let i = 1; i <= SECTION_COUNT; i++){
        try {
          const raw = localStorage.getItem(sectionKey(s.id, t.id, i));
          secs.push(raw ? JSON.parse(raw) : null);
        } catch(e) { secs.push(null); }
      }
      termsPayload[t.id] = { settings: termSettings, sections: secs };
    });
    payload.subjects[s.id] = { terms: termsPayload };
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'parent-letter-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const payload = JSON.parse(evt.target.result);
      if (!payload.subjects || typeof payload.subjects !== 'object') throw new Error('Not a valid backup file');
      const linkedNote = syncMeta.uid ? '\n\nSync is linked on this device: restored sections will also replace the copies in Google Drive and on your other devices.' : '';
      if (!confirm('This will replace all data currently in this browser (for every subject and term) with the backup file. Continue?' + linkedNote)) return;
      SUBJECTS.forEach(s => {
        const entry = payload.subjects[s.id] || {};
        // Older backups (before per-term storage) stored settings/sections
        // directly on the subject entry. Treat those as Term 1 for compatibility.
        const isLegacyFormat = !entry.terms && (entry.settings || entry.sections);
        TERMS.forEach(t => {
          let termEntry = entry.terms ? entry.terms[t.id] : null;
          if (!termEntry && isLegacyFormat && t.id === '1') termEntry = entry;
          const termSettings = Object.assign(defaultSettings(), (termEntry && termEntry.settings) || {});
          const settingsRaw = JSON.stringify(termSettings), settingsPrev = localStorage.getItem(settingsKey(s.id, t.id));
          localStorage.setItem(settingsKey(s.id, t.id), settingsRaw);
          if (!isBlankRecord('settings', termSettings)) syncNoteEdit(settingsKey(s.id, t.id), settingsRaw, settingsPrev);
          const secs = (termEntry && Array.isArray(termEntry.sections)) ? termEntry.sections : [];
          for (let i = 1; i <= SECTION_COUNT; i++){
            const sec = Object.assign(blankSection(i), secs[i-1] || {});
            const secRaw = JSON.stringify(sec), secPrev = localStorage.getItem(sectionKey(s.id, t.id, i));
            localStorage.setItem(sectionKey(s.id, t.id, i), secRaw);
            if (!isBlankRecord('section', sec)) syncNoteEdit(sectionKey(s.id, t.id, i), secRaw, secPrev);
          }
        });
      });
      currentSubjectId = (payload.currentSubject && SUBJECTS.some(s => s.id === payload.currentSubject)) ? payload.currentSubject : SUBJECTS[0].id;
      currentTermId = (payload.currentTerm && TERMS.some(t => t.id === payload.currentTerm)) ? payload.currentTerm : TERMS[0].id;
      try {
        localStorage.setItem('plg-current-subject', currentSubjectId);
        localStorage.setItem('plg-current-term', currentTermId);
      } catch(err) {}
      loadSubjectTermData(currentSubjectId, currentTermId);
      alert('Backup restored successfully.');
      render();
      scheduleSync();
    } catch(err) {
      alert('Could not read that file as a valid backup: ' + err.message);
    }
  };
  reader.readAsText(file);
}

let toastTimer = null;

    t = document.createElement('div'); t.id = 'plg-toast'; t.className = 'plg-toast no-print';
    t.setAttribute('role', 'status');
    document.getElementById('plg-root').appendChild(t);

let lastSpark = 0;
function sparkle(){
  const d = THEME_DEFS[currentTheme];

  lastSpark = Date.now();
  for (let i = 0; i < 7; i++){
    const sp = document.createElement('span');
    sp.className = 'plg-spk no-print';
    sp.setAttribute('aria-hidden', 'true');
    sp.textContent = d.sp[i % d.sp.length];
    sp.style.left = (22 + Math.random() * 56) + 'vw';
    sp.style.top = (45 + Math.random() * 30) + 'vh';
    sp.style.animationDelay = (i * 0.06) + 's';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1500);
  }
}
function cheer(btn){
  const d = THEME_DEFS[currentTheme];

  showToast(d.msgs[Math.floor(Math.random() * d.msgs.length)]);

}
function renderTheme(container){
  const card = document.createElement('div'); card.className = 'plg-card';
  card.innerHTML = `
    <h2>Theme</h2>
    <p class="plg-sub">Pick how this page looks. Themes only change the screen &mdash; printed letters always look exactly the same. Your choice is remembered on this device.</p>
    <div class="plg-themegrid" role="group" aria-label="Choose a theme"></div>`;
  const grid = card.querySelector('.plg-themegrid');

function allSyncKeys(){

// Each section is merged row by row (row 0 = section name + maximum scores, then one row per student),

function rowSigs(d){
  return [JSON.stringify([d.name, d.wwMax, d.petaMax, d.summMax, d.teMax])].concat((d.students || []).map(s => JSON.stringify(s)));
}
function rowIsBlank(d, i){

  const arrEmpty = a => !Array.isArray(a) || a.every(empty);
  if (i === 0) return /^Section \d+$/.test(String(d.name || '')) && arrEmpty(d.wwMax) && arrEmpty(d.petaMax) && arrEmpty(d.summMax) && empty(d.teMax);
  const s = (d.students || [])[i - 1];

// Called whenever the app itself writes a section/settings record.
function syncNoteEdit(key, raw, prevRaw){

function mergeRows(l, r, localWins){

  out.students = [];
  const rm = [Math.max(lrm[0] || 0, rrm[0] || 0)];

// A record with nothing entered. Blank records never overwrite real data.
function isBlankRecord(kind, d){

  if (!arrEmpty(d.wwMax) || !arrEmpty(d.petaMax) || !arrEmpty(d.summMax) || !empty(d.teMax)) return false;
  return !(d.students || []).some(s => s && (s.name || !arrEmpty(s.wwScores) || !arrEmpty(s.petaScores) || !arrEmpty(s.summScores) || !empty(s.teScore)));

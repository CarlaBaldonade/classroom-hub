<style>
:root{--bg:#f3faf8;--card:#fff;--ink:#23403a;--muted:#6f8a84;--pri:#19a58a;--pri2:#5fd4b8;--soft:#dff5ef;--line:#d4e8e2;--good:#1f9d55;--warn:#e69a1a;--bad:#d64545;--r:16px;--fh:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--pat:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--fb);color:var(--ink);background:var(--bg);background-image:var(--pat);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:880px;margin:0 auto;min-height:100%;padding:0 12px 92px}
#top{position:sticky;top:0;z-index:5;margin:0 -12px 10px;padding:10px 14px 8px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#top .brand{font:600 21px var(--fh);letter-spacing:.3px;display:flex;align-items:center;gap:7px}
#top .sub{font-size:11.5px;opacity:.92;margin-left:auto;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.25);font-size:11px;font-weight:700}
h2{font:600 17px var(--fh);margin:14px 2px 8px}h3{font:600 15px var(--fh);margin:10px 0 6px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 13px;margin:0 0 10px;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative}
.card.deco::after{content:var(--emo);position:absolute;right:10px;top:6px;font-size:18px;opacity:.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:800}.c{text-align:center}
.btn{border:0;border-radius:12px;padding:8px 13px;background:var(--soft);color:var(--ink);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}.btn.bad{background:var(--erbg);color:var(--erfg)}.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.big{padding:14px 16px;font-size:15px;border-radius:15px}.btn[disabled]{opacity:.45;pointer-events:none}.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label.f{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:800;cursor:pointer;font-size:13px;color:var(--ink)}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill.ok.on,.pill.wn.on{color:#fff}
.pill.ok{background:var(--okbg);border-color:var(--okbd);color:var(--okfg)}.pill.wn{background:var(--wnbg);border-color:var(--wnbd);color:var(--wnfg)}.pill.er{background:var(--erbg);border-color:var(--erbd);color:var(--erfg)}.pill.bl{background:var(--blbg);color:var(--muted)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,transparent)}
#nav .in{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:5px;box-shadow:0 4px 16px rgba(0,0,0,.12);width:100%;max-width:520px}
#nav button{flex:1;border:0;background:transparent;border-radius:17px;padding:6px 2px;font-weight:800;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button span{font-size:20px;line-height:1.1}#nav button.on{background:var(--soft);color:var(--pri)}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.modal.sheet{background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.sheet>.in{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:12px 14px 22px}
.modal>.in{max-width:760px;margin:0 auto;padding:0 12px 120px}
.mbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1.5px solid var(--line);margin:0 -12px 8px}
.mbar .t{font:600 16px var(--fh);flex:1}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--line);display:flex;gap:8px;justify-content:center}
.foot .btn{flex:1;max-width:340px;justify-content:center}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;background:#23403a;color:#fff;padding:9px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.banner{border-radius:13px;padding:9px 12px;margin:0 0 8px;font-weight:700;font-size:13px}
.banner.wn{background:var(--wnbg);color:var(--wnfg);border:1.5px solid var(--wnbd)}.banner.er{background:var(--erbg);color:var(--erfg);border:1.5px solid var(--erbd)}.banner.ok{background:var(--okbg);color:var(--okfg);border:1.5px solid var(--okbd)}.banner.in{background:var(--soft);color:var(--ink)}
.item{border:1.5px solid var(--line);border-radius:14px;padding:8px;margin:0 0 8px;background:var(--card)}
.item.fl{border-color:var(--wnbd);background:var(--card)}.item.mu{border-color:var(--erbd);background:var(--card)}.item.rs{border-color:var(--okbd);background:var(--card)}
.item canvas{width:100%;display:block;border-radius:8px;background:#fff;border:1px solid var(--line)}
.bars{display:flex;gap:4px;margin:5px 0}.bars div{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}
.bars i{display:block;height:5px;border-radius:3px;background:var(--pri);margin:2px 0}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.agrid button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 0;font-weight:800;cursor:pointer;font-size:12.5px}
.agrid button small{display:block;font-size:9.5px;color:var(--muted);font-weight:700}
.agrid .ok{background:var(--okbg);border-color:var(--okbd)}.agrid .wn{background:var(--wnbg);border-color:var(--wnbd)}.agrid .er{background:var(--erbg);border-color:var(--erbd)}.agrid .bl{background:var(--blbg)}.agrid .rs{background:var(--rsbg);border-color:var(--rsbd)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}.tbl th{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri)}
.stat{flex:1;min-width:80px;background:var(--soft);border-radius:13px;padding:8px;text-align:center}.stat b{display:block;font:600 19px var(--fh)}.stat span{font-size:11px;color:var(--muted);font-weight:700}
.theme{border:2px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer;background:var(--card);font-weight:800;font-size:12px}.theme.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--soft)}.theme .sw{height:22px;border-radius:8px;margin-bottom:5px}
#cam{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#cam canvas.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#cam .hud{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;gap:8px;align-items:center;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
#cam .msg{position:absolute;left:0;right:0;bottom:116px;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 4px #000;padding:0 14px}
#cam .ctl{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:22px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
#cam .shut{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
#cam .rb{border:0;border-radius:99px;padding:9px 14px;background:rgba(255,255,255,.22);color:#fff;font-weight:800}
#cam .rb.on{background:#fff;color:#000}
.spin{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.spin div{background:#23403a;padding:16px 24px;border-radius:18px}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block}@page{size:A4;margin:0}html,body{background:#fff!important}}
.zoomwrap{overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;max-height:70vh}
.help{font-size:12.5px;color:var(--muted)}.help li{margin:3px 0}
@media(min-width:700px){body{font-size:15px}}

.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;flex:none;margin:3px 0 0}

.nmimg{aspect-ratio:94/40;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0}.nmimg img{width:100%;display:block}

</style></head>
<body>
<div id="app"><header id="top"><div class="brand"><span>📑</span> Scanora</div><div class="sub"><span class="chip" id="syncchip">●</span></div></header><main id="view"></main></div>
<nav id="nav"><div class="in"><button data-tab="exams"><span>📝</span>Exams</button><button data-tab="scan"><span>📷</span>Scan</button><button data-tab="results"><span>📊</span>Results</button><button data-tab="settings"><span>⚙️</span>Settings</button></div></nav>
<div id="mroot"></div><div id="toast"></div><div id="printRoot"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden><input type="file" id="fileGal" accept="image/*" multiple hidden><input type="file" id="fileHub" accept=".json,application/json" hidden><input type="file" id="fileBak" accept=".json,application/json" hidden>
<script>
/* ===== SCANORA CORE: sheet geometry, sheet drawing, scanning ===== */
const SC=(()=>{
'use strict';
const CPX=6, PW=210, PH=297;                       // canonical pixels per mm, A4 size in mm
const MK={tl:{x:14,y:14,s:11},tr:{x:196,y:14,s:8},bl:{x:14,y:283,s:8},br:{x:196,y:283,s:8}};
const CODE={x0:142,y:11.2,pitch:4.2,size:3.4,n:11};
const IDG={x0:121,pitch:7.6,ys:[38.8,46.8],a:3.0,b:2.5,fs:3.4};
const HEAD={x:16,y:27.5,w:94,h:40};                // handwriting block (mm)
const AR=2.4;
const LET='ABCDE';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- layout (shared by printing and scanning) ---------- */
function layout(n,ch){
  n=Math.max(1,Math.min(100,n|0)); ch=ch===5?5:4;
  const cols=Math.ceil(n/25), rows=Math.ceil(n/cols), colW=178/cols;
  const numW=8, p=Math.min(14,(colW-numW-1)/ch), w=Math.min(10.5,p-1.8), h=Math.min(5.8,w);
  const a=w/2-.25, b=h/2-.25, fs=Math.min(3.4,h*.58), blockW=numW+p*ch;
  const heads=[], items=[];
  for(let c=0;c<cols;c++){
    const bx=16+c*colW+(colW-blockW)/2, cx=[];
    for(let k=0;k<ch;k++) cx.push(bx+numW+p*(k+.5));
    heads.push({c,bx,cx,y:80});
  }
  const rp=rows>=25?7.5:Math.max(7.5,Math.min(9.2,189/((rows-1)+Math.floor((rows-1)/5)*.24)));
  for(let i=0;i<n;i++){
    const c=Math.floor(i/rows), r=i%rows, hd=heads[c];
    items.push({i,c,r,y:83+r*rp+Math.floor(r/5)*rp*.24,cx:hd.cx,numX:hd.bx+numW-1.5});
  }
  return {n,ch,cols,rows,p,w,h,d:h,a,b,fs,ex:w<7?0:fs*.42,dense:w<7,items,heads};
}

/* ---------- sheet-type code (10 cells, top right) ---------- */
function codeBits(n,ch){
  const b=[1]; for(let i=6;i>=0;i--) b.push((n>>i)&1);
  b.push(ch===5?1:0); let par=0; for(let i=1;i<=8;i++) par^=b[i]; b.push(par); b.push(1); return b;
}
function decodeBits(b){
  if(b[0]!==1) return null; let par=0; for(let i=1;i<=8;i++) par^=b[i];
  if(par!==b[9]) return null; let n=0; for(let i=1;i<=7;i++) n=(n<<1)|b[i];
  if(n<1||n>100) return null; return {n,ch:b[8]?5:4,id:b[10]===1};
}

/* ---------- printable answer sheet (SVG in millimetres) ---------- */
function sheetSVG(o){
  const L=layout(o.n,o.ch), out=[];
  const T=(x,y,s,txt,ex)=>out.push(`<text x="${x}" y="${y}" font-size="${s}" ${ex||''}>${esc(txt)}</text>`);
  const line=(x1,y,x2,w)=>out.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#000" stroke-width="${w||.3}"/>`);
  out.push(`<rect width="210" height="297" fill="#fff"/>`);
  for(const k in MK){const m=MK[k];out.push(`<rect x="${m.x-m.s/2}" y="${m.y-m.s/2}" width="${m.s}" height="${m.s}" fill="#000"/>`);}
  T(24,17.4,6.2,'SCANORA','font-weight="700" letter-spacing=".5"');
  T(24,22.2,3,`Answer Sheet  ·  ${o.n} items  ·  choices ${LET.slice(0,o.ch).split('').join(' ')}`,'fill="#333"');
  const bits=codeBits(o.n,o.ch);
  bits.forEach((b,i)=>{const x=CODE.x0+i*CODE.pitch; out.push(`<rect x="${x}" y="${CODE.y}" width="${CODE.size}" height="${CODE.size}" fill="${b?'#000':'none'}" stroke="#000" stroke-width=".2"/>`);});
  T(CODE.x0,19.8,1.9,'SHEET CODE - DO NOT MARK','fill="#555"');
  const fv=()=>'';
  const fld=(label,lx,x1,x2,y,val)=>{T(lx,y,3.4,label,'font-weight="700"');line(x1,y+.6,x2,.3); if(val)T(x1+1,y-.4,3.8,val,'fill="#111"');};
  fld('Name:',16,29,108,35.5,'');
  fld('Subject:',16,33,108,45.5,fv(o.subject));
  fld('Grade:',16,28,50,55.5,fv(o.grade));
  fld('Section:',54,69,108,55.5,fv(o.section));
  fld('Date:',16,27,70,65,fv(o.date));
  T(112,30.6,3.2,'STUDENT NO.','font-weight="700"'); T(138,30.6,2.4,'(shade your 2-digit number)','fill="#444"');
  IDG.ys.forEach((y,r)=>{T(111.6,y+.9,2.4,r?'2nd':'1st','fill="#444"');for(let k=0;k<10;k++){const x=IDG.x0+k*IDG.pitch;out.push(`<ellipse cx="${x.toFixed(2)}" cy="${y}" rx="${IDG.a}" ry="${IDG.b}" fill="none" stroke="#000" stroke-width=".5"/>`);T(x.toFixed(2),y+IDG.fs*.36,IDG.fs,String(k),'text-anchor="middle" font-weight="600" fill="#444"');}});
  T(112,55,2.5,'Example: No. 07 = shade 0 in the 1st row, 7 in the 2nd row.','fill="#222"');
  T(112,58.6,2.5,'Use a dark pen or soft pencil. Shade the circle completely.','fill="#222"');
  T(112,62.2,2.5,'Erase fully to change an answer.','fill="#222"');
  T(112,65.8,2.5,'Do not fold, tear or write on the black squares.','fill="#222"');
  line(16,68,194,.4);
  if(o.title) T(16,74.2,4.2,o.title,'font-weight="700"');
  for(const it of L.items){
    T(it.numX,it.y+1.15,3.2,String(it.i+1),'text-anchor="end"');
    it.cx.forEach((x,k)=>{out.push(`<ellipse cx="${x.toFixed(2)}" cy="${it.y.toFixed(2)}" rx="${L.a.toFixed(2)}" ry="${L.b.toFixed(2)}" fill="none" stroke="#000" stroke-width=".5"/>`);T(x.toFixed(2),(it.y+L.fs*.36).toFixed(2),L.fs,LET[k],`text-anchor="middle" font-weight="${L.dense?400:600}" fill="${L.dense?'#777':'#444'}"`);});
  }
  T(16,292,2.4,'Scanora · keep sheet flat when scanning','fill="#777"');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Arial, Helvetica, sans-serif">${out.join('')}</svg>`;
}

/* ---------- image helpers ---------- */
function gray(rgba,w,h){const g=new Uint8Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(rgba[j]*77+rgba[j+1]*150+rgba[j+2]*29)>>8;return g;}

function binarize(g,w,h){
  const W1=w+1, I=new Float64Array(W1*(h+1));
  for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+row;}}
  const s=Math.max(15,Math.round(Math.max(w,h)/10))|1, r=s>>1, bin=new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const mean=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0));
      const v=g[y*w+x]; bin[y*w+x]=(v<mean*0.78&&v<165)?1:0;
    }
  }
  return bin;
}

function components(bin,w,h,minA,maxA){
  const seen=new Uint8Array(w*h), stack=new Int32Array(w*h), out=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const s0=y*w+x; if(!bin[s0]||seen[s0])continue;
    let sp=0; stack[sp++]=s0; seen[s0]=1;
    let a=0,sx=0,sy=0,sxx=0,syy=0,sxy=0,x0=x,x1=x,y0=y,y1=y;
    while(sp){
      const p=stack[--sp], px=p%w, py=(p-px)/w;
      a++; sx+=px; sy+=py; sxx+=px*px; syy+=py*py; sxy+=px*py;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
      if(px>0){const q=p-1; if(bin[q]&&!seen[q]){seen[q]=1;stack[sp++]=q;}}
      if(px<w-1){const q=p+1; if(bin[q]&&!seen[q]){seen[q]=1;stack[sp++]=q;}}
      if(py>0){const q=p-w; if(bin[q]&&!seen[q]){seen[q]=1;stack[sp++]=q;}}
      if(py<h-1){const q=p+w; if(bin[q]&&!seen[q]){seen[q]=1;stack[sp++]=q;}}
    }
    if(a<minA||a>maxA)continue;
    const mx=sx/a, my=sy/a, cxx=sxx/a-mx*mx+1/12, cyy=syy/a-my*my+1/12, cxy=sxy/a-mx*my;
    const tr=cxx+cyy, det=cxx*cyy-cxy*cxy, disc=Math.sqrt(Math.max(0,tr*tr/4-det));
    const l1=tr/2+disc, l2=Math.max(1e-6,tr/2-disc);
    out.push({x:mx,y:my,area:a,l1,l2,bw:x1-x0+1,bh:y1-y0+1});
  }
  return out;
}

/* ---------- find the 4 corner squares (any rotation / orientation) ---------- */
function detect(g,w,h){
  const L=Math.max(w,h), bin=binarize(g,w,h);
  const blobs=components(bin,w,h,Math.max(20,Math.floor(0.9e-4*L*L)),Math.floor(0.0064*L*L));
  const cand=blobs.filter(b=>{
    if(b.bw<5||b.bh<5)return false;
    if(b.l1/b.l2>1.8)return false;
    const sq=b.area/(12*Math.sqrt(b.l1*b.l2)); return sq>0.72&&sq<1.28;
  }).sort((a,b)=>b.area-a.area).slice(0,14);
  if(cand.length<4)return null;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let best=null;
  const M=cand.length;
  for(let a=0;a<M;a++)for(let b=a+1;b<M;b++)for(let c=b+1;c<M;c++)for(let d=c+1;d<M;d++){
    const set=[cand[a],cand[b],cand[c],cand[d]];           // already sorted by area desc
    const A=set[0], o=[set[1],set[2],set[3]];
    const mo=(o[0].area+o[1].area+o[2].area)/3, ar=A.area/mo;
    if(ar<1.2||ar>3)continue;
    if(o[0].area/o[2].area>1.8)continue;
    o.sort((p,q)=>dist(A,q)-dist(A,p));                    // farthest first
    const D=o[0], B=o[1], T=o[2];                           // D=diagonal, B=far adjacent(BL), T=near adjacent(TR)
    const dT=dist(A,T), dB=dist(A,B), rat=dT/dB;

    const px=T.x+B.x-A.x, py=T.y+B.y-A.y, err=Math.hypot(D.x-px,D.y-py)/dist(A,D);
    if(err>0.16)continue;
    const cross=(T.x-A.x)*(B.y-A.y)-(T.y-A.y)*(B.x-A.x);
    if(cross<=0)continue;                                   // mirrored
    const score=err+Math.abs(rat-0.676)*0.5+Math.abs(ar-1.89)/1.89*0.1;
    if(!best||score<best.score)best={score,tl:A,tr:T,bl:B,br:D};

  const q=best, pxmm=(dist(q.tl,q.tr)/182+dist(q.bl,q.br)/182+dist(q.tl,q.bl)/269+dist(q.tr,q.br)/269)/4;

  return {tl:P(q.tl),tr:P(q.tr),bl:P(q.bl),br:P(q.br),pxmm,score:q.score};
}

/* ---------- homography + warp to a flat 6 px/mm picture ---------- */
function solve(A,b){
  const n=b.length; for(let i=0;i<n;i++)A[i].push(b[i]);
  for(let i=0;i<n;i++){
    let m=i; for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]]; const pv=A[i][i]; if(Math.abs(pv)<1e-12)return null;
    for(let c=i;c<=n;c++)A[i][c]/=pv;
    for(let r=0;r<n;r++)if(r!==i){const f=A[r][i]; if(f)for(let c=i;c<=n;c++)A[r][c]-=f*A[i][c];}
  }
  return A.map(r=>r[n]);
}
function homography(det){
  const src=[[MK.tl.x,MK.tl.y],[MK.tr.x,MK.tr.y],[MK.br.x,MK.br.y],[MK.bl.x,MK.bl.y]];
  const dst=[det.tl,det.tr,det.br,det.bl].map(p=>[p.x,p.y]);
  const A=[],b=[];
  for(let i=0;i<4;i++){const [X,Y]=src[i],[x,y]=dst[i];
    A.push([X,Y,1,0,0,0,-x*X,-x*Y]);b.push(x);
    A.push([0,0,0,X,Y,1,-y*X,-y*Y]);b.push(y);}
  return solve(A,b);
}
function warp(g,w,h,det,scale){
  scale=scale||CPX; const H=homography(det); if(!H)return null;
  const CW=Math.round(PW*scale), CH=Math.round(PH*scale), out=new Uint8Array(CW*CH);
  for(let j=0;j<CH;j++){
    const Y=(j+.5)/scale;
    for(let i=0;i<CW;i++){
      const X=(i+.5)/scale, den=H[6]*X+H[7]*Y+1;
      const x=(H[0]*X+H[1]*Y+H[2])/den, y=(H[3]*X+H[4]*Y+H[5])/den;
      if(x<0||y<0||x>=w-1||y>=h-1){out[j*CW+i]=255;continue;}
      const xi=x|0, yi=y|0, fx=x-xi, fy=y-yi, k=yi*w+xi;
      out[j*CW+i]=(g[k]*(1-fx)+g[k+1]*fx)*(1-fy)+(g[k+w]*(1-fx)+g[k+w+1]*fx)*fy;
    }
  }
  return {data:out,w:CW,h:CH,scale};
}

const SENS={lenient:{mark:.32,empty:.13,faint:.08},normal:{mark:.40,empty:.16,faint:.10},strict:{mark:.50,empty:.20,faint:.12}};
const ANG=[];for(let a=0;a<16;a++)ANG.push([Math.cos(a*Math.PI/8),Math.sin(a*Math.PI/8)]);

const med=a=>{if(!a.length)return 0;const c=a.slice().sort((x,y)=>x-y);return c[c.length>>1];};

function analyze(canon,o){
  const G=canon.data, CW=canon.w, CH=canon.h, S=canon.scale, sens=SENS[o.sens]||SENS.normal;
  const at=(x,y)=>{const i=Math.round(x*S-.5), j=Math.round(y*S-.5);return (i<0||j<0||i>=CW||j>=CH)?255:G[j*CW+i];};
  const boxMean=(cx,cy,hw)=>{let s=0,n=0;for(let y=Math.floor((cy-hw)*S);y<=Math.ceil((cy+hw)*S);y++)for(let x=Math.floor((cx-hw)*S);x<=Math.ceil((cx+hw)*S);x++){if(x<0||y<0||x>=CW||y>=CH)continue;s+=G[y*CW+x];n++;}return n?s/n:255;};

    for(let y=Math.floor((cy-rb)*S);y<=Math.ceil((cy+rb)*S);y++)for(let x=Math.floor((cx-ra)*S);x<=Math.ceil((cx+ra)*S);x++){
      const ux=(x+.5)/S-cx, uy=(y+.5)/S-cy; if((ux*ux)/(ra*ra)+(uy*uy)/(rb*rb)>1||Math.abs(ux)<ex||x<0||y<0||x>=CW||y>=CH)continue;

  }

  if(dec.id){
    const ia=IDG.a, ib=IDG.b, iex=IDG.fs*.42, rowsI=[];
    const cxs=[];for(let k=0;k<10;k++)cxs.push(IDG.x0+k*IDG.pitch);
    for(const y0 of IDG.ys){
      const E=(dx,dy)=>{let e=0;for(const cx of cxs)for(const a of ANG)e+=at(cx+dx+(ia+.9)*a[0],y0+dy+(ib+.9)*a[1])-at(cx+dx+ia*a[0],y0+dy+ib*a[1]);return e;};
      let best=-1e18,bx=0,by=0;

      const idx=f.map((v,k)=>k).sort((a,b)=>f[b]-f[a]), m1=f[idx[0]], m2=f[idx[1]];

    }
    const st=rowsI.map(r=>r.status);
    let state='bad', num=null;
    if(st[0]==='blank'&&st[1]==='blank') state='none';

      const fv=Math.max(0,(inkFill(cx,cy,.74*L.a,.74*L.b,L.ex,Wb)-base)/(1-base)); f.push(fv);
      let q=0;for(const a of ANG)q+=at(cx+(L.a+.9)*a[0],cy+(L.b+.9)*a[1])-at(cx+L.a*a[0],cy+L.b*a[1]);

    const marks=f.map((v,k)=>v>=sens.mark?k:-1).filter(k=>k>=0);

/* ---------- one-call pipeline on an RGBA image ---------- */
function scan(rgba,w,h,o){
  const g=gray(rgba,w,h), det=detect(g,w,h);

  if(det.pxmm<2.6) return {error:'lowres',pxmm:det.pxmm};

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||2200);}
function beep(kind){if(!S.set.sound)return;try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=kind==='warn'?300:kind==='err'?200:880;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(kind==='ok'?.14:.3));o.start();o.stop(c.currentTime+.32);if(navigator.vibrate)navigator.vibrate(kind==='ok'?30:[60,40,60]);}catch(e){}}
function spinner(msg){const d=document.createElement('div');d.className='spin';d.innerHTML=`<div>${esc(msg||'Working…')}</div>`;document.body.appendChild(d);return ()=>d.remove();}

function openModal(html,sheet){const m=document.createElement('div');m.className='modal'+(sheet?' sheet':'');m.innerHTML=`<div class="in">${html}</div>`;$('#mroot').appendChild(m);if(sheet)m.addEventListener('click',e=>{if(e.target===m)m.remove();});return m;}
function ask(title,body,buttons){return new Promise(res=>{const m=openModal(`<h3>${esc(title)}</h3><p>${body}</p><div class="row" style="justify-content:flex-end;margin-top:10px">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div>`,true);m.style.zIndex=60;m.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){m.remove();res(buttons[+b.dataset.i].v);}else if(e.target===m){m.remove();res(null);}});});}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}

const examOf=id=>S.exams.find(e=>e.id===id&&!e.del);
function scoreOf(ex,ans){let s=0;for(let i=0;i<ex.n;i++){const k=ex.key[i];if(k&&ans[i]&&ans[i]!=='*'&&k.includes(ans[i]))s++;}return s;}
function resultsOf(exId){return live(S.results).filter(r=>r.examId===exId);}
function rosterKey(g,s){return norm(g)+'|'+norm(s);}

/* ---------- sections: class lists with 2-digit student numbers ---------- */
const pad2=n=>String(n).padStart(2,'0');
const secOf=id=>{const s=id&&S.secs[id];return s&&!s.del?s:null;};
const liveSecs=()=>Object.values(S.secs).filter(s=>!s.del).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
const secStu=s=>s.stu.filter(x=>!x.gone).sort((a,b)=>a.no-b.no);
const stuByNo=(s,n)=>s.stu.find(x=>x.no===n&&!x.gone)||null;
function hubRead(){try{const o=JSON.parse(localStorage.getItem('classroomhub.v1'));if(o&&Array.isArray(o.classes))return hubClean(o.classes);}catch(e){}return null;}
function hubClean(cl){return cl.filter(c=>c&&c.id&&Array.isArray(c.students)).map(c=>({id:String(c.id),name:String(c.name||'Class'),students:c.students.filter(s=>s&&s.id&&String(s.name||'').trim()).map(s=>({id:String(s.id),name:String(s.name).trim()}))}));}
/* give new students the next free numbers (first time: alphabetical). returns how many did not fit in 1-99 */
function numberNew(s,fresh){
  if(!s.stu.length)fresh=fresh.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));
  const used=new Set(s.stu.map(x=>x.no));let over=0;
  fresh.forEach(h=>{let n=Math.max(0,...used)+1;if(n>99){n=1;while(n<=99&&used.has(n))n++;}
    if(n>99){over++;return;}used.add(n);s.stu.push(Object.assign({no:n},h));});
  return over;
}
function applyHub(hc){
  const old=Object.values(S.secs).find(x=>x.hubId===hc.id);
  const s=old||(S.secs['h_'+hc.id]={id:'h_'+hc.id,hubId:hc.id,name:hc.name,stu:[]});
  s.del=false;s.name=hc.name;
  const byH=new Map(s.stu.filter(x=>x.hid).map(x=>[x.hid,x])),seen=new Set(),fresh=[];
  hc.students.forEach(h=>{seen.add(h.id);const x=byH.get(h.id);if(x){x.name=h.name;x.gone=false;}else fresh.push({hid:h.id,id:'s'+h.id,name:h.name});});
  s.stu.forEach(x=>{if(x.hid&&!seen.has(x.hid))x.gone=true;});
  const over=numberNew(s,fresh);stamp(s);return {s,over,added:fresh.length-over};
}

   nocode:'Could not read the sheet code at the top. Check the lighting and that the top of the sheet is sharp and visible.',
   blur:'The picture is blurry. Hold steady, let the camera focus, and try again.',

  if(out.error==='format')return `This is a ${out.found.n}-item sheet (${LETS(out.found.ch).join('')}), but the selected exam uses ${e.n} items (${LETS(e.ch).join('')}). Pick the matching exam, or print the correct sheet.`;

async function handleFiles(files){

    done();

  catch(err){closeCamera();toast('Camera is blocked. Allow camera access in your browser, or use “Take a photo”.',4000);return;}
  CAM.video.srcObject=CAM.stream;try{await CAM.video.play();}catch(e2){}
  try{const tr=CAM.stream.getVideoTracks()[0],cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.torch)$('#camTorch').hidden=false;}catch(e3){}

function camInfo(){if(!CAM)return;const n=resultsOf(CAM.e.id).length;$('#camInfo').textContent=`${CAM.e.title} · ${SCAN.mode==='student'?n+' saved':SCAN.mode==='key'?'scan the key sheet':'practice'}`;}

function camMsg(t){const m=$('#camMsg');if(m)m.textContent=t;}

  const g=ov.getContext('2d');g.scale(dpr,dpr);const sc=Math.min(cw/vw,ch/vh),ox=(cw-vw*sc)/2,oy=(ch-vh*sc)/2,P=p=>[ox+p.x/k*sc,oy+p.y/k*sc];

async function camCapture(){

  const cv=imgToCanvas(v,v.videoWidth,v.videoHeight);camMsg('Reading…');await tick();
  const out=runScan(cv,e);

  if(out.error){beep('err');CAM.busy=false;CAM.stable=0;CAM.msgUntil=Date.now()+3500;camMsg('⚠️ '+errText(out,e));return;}
  const flagged=out.items.some(i=>i.status==='unclear'||i.status==='multi');beep(flagged||out.warn.length?'warn':'ok');

function analysisHtml(e,rs){
  const L=LETS(e.ch);let rows='';
  for(let i=0;i<e.n;i++){
    const cnt={},tot=rs.length;let ok=0;L.forEach(l=>cnt[l]=0);let blank=0;
    rs.forEach(r=>{const a=r.ans[i];if(a&&cnt[a]!=null)cnt[a]++;else blank++;if(a&&a!=='*'&&(e.key[i]||'').includes(a))ok++;});
    const p=Math.round(ok/tot*100),k=e.key[i]||'?';
    rows+=`<tr><td><b>${i+1}</b></td><td>${esc(k)}</td><td style="min-width:90px"><div class="bar"><i style="width:${p}%;${p<40?'background:var(--bad)':''}"></i></div></td><td>${p}%</td>${L.map(l=>`<td style="${(e.key[i]||'').includes(l)?'font-weight:800;color:var(--good)':''}">${cnt[l]}</td>`).join('')}<td class="muted">${blank}</td></tr>`;
  }
  return `<div class="card" style="overflow:auto"><table class="tbl"><tr><th>#</th><th>Key</th><th>Correct</th><th></th>${L.map(l=>`<th>${l}</th>`).join('')}<th>–</th></tr>${rows}</table></div>`;
}

  const s=secOf(t.dataset.sec),x=s&&s.stu.find(y=>y.id===t.dataset.sn);if(!x)return;
  const n=parseInt(t.value,10);
  if(!(n>=1&&n<=99)){toast('Use a number from 01 to 99');t.value=pad2(x.no);return;}
  const o=s.stu.find(y=>y.no===n&&y!==x);
  if(o){toast(`${pad2(n)} is already used by ${o.name}`,3200);t.value=pad2(x.no);return;}
  x.no=n;stamp(s);save();t.value=pad2(n);toast('Number changed. Tell the student.');
}

/* ---------- Google Drive sync ---------- */
function detectClientId(){try{for(let i=0;i<localStorage.length;i++){const v=localStorage.getItem(localStorage.key(i))||'';const m=v.match(/\d{6,}-[a-z0-9]{20,}\.apps\.googleusercontent\.com/i);if(m)return m[0];}}catch(e){}return '1054809448673-4iq7a4bm911b3kcsfcb0o7281odig2rm.apps.googleusercontent.com';}
let gTok=null,gExp=0;
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s);});}
async function gAuth(){
  if(gTok&&Date.now()<gExp-60000)return gTok;
  const cid=S.set.clientId||detectClientId();if(!cid)throw new Error('noclient');
  await loadGIS();
  return new Promise((res,rej)=>{const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;res(gTok);},error_callback:e=>rej(new Error((e&&e.type)||'auth'))});tc.requestAccessToken({prompt:S.set.syncOn?'':'consent'});});
}
const dfetch=async(url,opt)=>{const r=await fetch(url,Object.assign({headers:{Authorization:'Bearer '+gTok}},opt||{}));if(!r.ok)throw new Error('drive '+r.status);return r;};
function mergeLists(a,b){const m=new Map();for(const x of a.concat(b||[])){const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x);}const cut=Date.now()-60*864e5;return [...m.values()].filter(x=>!(x.del&&(x.u||0)<cut));}
function mergeRemote(rm){
  S.exams=mergeLists(S.exams,rm.exams);S.results=mergeLists(S.results,rm.results);
  for(const k in (rm.secs||{})){const o=S.secs[k],n=rm.secs[k];if(!o||(n.u||0)>(o.u||0))S.secs[k]=n;}
  for(const k in (rm.rosters||{})){const o=S.rosters[k],n=rm.rosters[k];if(!o||(n.u||0)>(o.u||0))S.rosters[k]=n;}
}
let syncing=false;
async function syncNow(interactive){
  if(syncing)return;syncing=true;const stat=$('#syncStat');if(stat)stat.textContent='Syncing…';
  try{
    await gAuth();
    const q=encodeURIComponent("name='scanora-data.json'"),list=await (await dfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json();
    let fid=list.files&&list.files[0]&&list.files[0].id;
    if(fid){const rm=await (await dfetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`)).json();mergeRemote(rm);}
    const body=JSON.stringify({v:1,exams:S.exams,results:S.results,rosters:S.rosters,secs:S.secs,u:Date.now()});
    if(fid)await dfetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body});
    else{const bd='scanora_b',meta=JSON.stringify({name:'scanora-data.json',parents:['appDataFolder']});await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+gTok,'Content-Type':'multipart/related; boundary='+bd},body:`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`});}
    S.set.syncOn=true;S.set.lastSync=Date.now();save(false);if(interactive)toast('Synced ✓');
  }catch(err){const msg=String(err&&err.message||err);if(interactive)toast(msg==='noclient'?'Paste your Google Client ID first (Settings → Google Client ID)':msg==='offline'?'You are offline. Scanora will sync later.':'Sync did not work ('+msg+')',3600);}
  finally{syncing=false;if(UI.tab==='settings')render();else if(UI.tab!=='scan')render();}
}
function syncSoon(){if(!S.set.syncOn||!navigator.onLine)return;clearTimeout(syncSoon.t);syncSoon.t=setTimeout(()=>syncNow(false),4000);}

  scMode:el=>{SCAN.mode=el.dataset.v;render();},
  liveScan:()=>openCamera(), takePhoto:()=>$('#fileCam').click(), choosePhotos:()=>$('#fileGal').click(),
  camClose:()=>closeCamera(), camShot:()=>camCapture(),
  camAuto:()=>{CAM.auto=!CAM.auto;S.set.auto=CAM.auto;save(false);$('#camAutoB').classList.toggle('on',CAM.auto);},
  camTorch:async()=>{try{CAM.torch=!CAM.torch;await CAM.stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:CAM.torch}]});$('#camTorch').classList.toggle('on',CAM.torch);}catch(e){toast('Flashlight not available');}},
  rvSet:el=>{const i=+el.dataset.i;RV.ans[i]=el.dataset.l;RV.rs[i]=true;rvDyn();if(RV.edit&&document.body.contains(RV.edit))RV.edit._repaint();},
  rvEdit:el=>rvEdit(+el.dataset.i), rvBlankOk:()=>{RV.blankAck=true;rvDyn();},
  rvName:el=>{RV.name=el.dataset.n;$('#rvName').value=RV.name;rvBtn();},
  rvSave:()=>rvSave(), rvSkip:()=>rvFinish('skip'), rvRescan:()=>{rvFinish('skip');toast('Scan that sheet again');}, rvView:()=>rvViewFull(),
  openResult:el=>openResult(el.dataset.id),
  rdItem:el=>{const m=el.closest('.modal'),r=m._r,e=m._e,i=+el.dataset.i,s=openModal('',true);s.style.zIndex=40;
    s.querySelector('.in').innerHTML=`<div class="row sp"><b>Item ${i+1}</b><button class="btn sm" data-a="close">✕</button></div><div class="small muted" style="margin:4px 0 8px">Answer key: ${esc(e.key[i]||'not set')}</div><div class="chips">${LETS(e.ch).map(L=>`<button class="pill ${r.ans[i]===L?'on':''}" data-a="rdSet" data-l="${L}">${L}</button>`).join('')}<button class="pill ${!r.ans[i]?'on':''}" data-a="rdSet" data-l="">Blank</button><button class="pill ${r.ans[i]==='*'?'on':''}" data-a="rdSet" data-l="*">✕ Wrong</button></div>`;s._m=m;s._i=i;},
  rdSet:el=>{const s=el.closest('.modal'),m=s._m,r=m._r;r.ans[s._i]=el.dataset.l;stamp(r);r.fix=[...new Set((r.fix||[]).concat(s._i))];save();s.remove();m._paint();render();},
  rdPic:el=>rdPic(el.closest('.modal')),
  rdDel:async el=>{const m=el.closest('.modal'),r=m._r;const a=await ask('Delete this result?',`Remove <b>${esc(r.name)}</b>'s sheet from this exam?`,[{t:'Cancel',v:0},{t:'Delete',v:1,cls:'bad'}]);if(!a)return;r.del=true;stamp(r);IDB.del('img_'+r.id);save();m.remove();render();toast('Deleted');},
  toggleAna:()=>{UI.analysis=!UI.analysis;render();}, exportScores:()=>exportScores(), exportAnswers:()=>exportAnswers(),
  sections:()=>openSections(), secOpen:el=>secOpen(el.dataset.id), secNew:()=>secOpen(''), secSave:el=>secSave(el.dataset.id), secPrint:el=>secPrint(el.dataset.id), hubGo:el=>hubGo(el),
  secHub:()=>{const hc=hubRead();if(!hc||!hc.length){ask('Classroom Hub not found here','Scanora could not see the Classroom Hub on this device. This works when Scanora and the Hub are opened from the same website address. You can also use <b>From a Hub backup file</b>.',[{t:'OK',v:1,cls:'pri'}]);return;}hubPick(hc,'from Classroom Hub');},
  secFile:()=>$('#fileHub').click(),
  secUpd:el=>{const s=secOf(el.dataset.id),hc=hubRead(),c=hc&&hc.find(x=>x.id===s.hubId);if(!c){toast('That class was not found in the Hub on this device',3200);return;}const r=applyHub(c);save();topPaint();render();toast(r.added?`${r.added} new student${r.added>1?'s':''} added`:'Already up to date ✓');},
  secRm:async el=>{const s=secOf(el.dataset.id),x=s&&s.stu.find(y=>y.id===el.dataset.sid);if(!x)return;const a=await ask('Remove student?',`<b>${esc(x.name)}</b> (No. ${pad2(x.no)}) leaves this list. Old results stay. The number is not reused.`,[{t:'Cancel',v:0},{t:'Remove',v:1,cls:'bad'}]);if(!a)return;x.gone=true;stamp(s);save();topPaint();},
  secDel:async el=>{const s=secOf(el.dataset.id);const a=await ask('Delete section?','The list and numbers are removed. Scanned results are kept.',[{t:'Cancel',v:0},{t:'Delete',v:1,cls:'bad'}]);if(!a)return;s.del=true;stamp(s);save();$$('.modal').slice(-1)[0].remove();topPaint();render();},

  backup:()=>download(`scanora-backup-${today()}.json`,JSON.stringify({v:1,exams:S.exams,results:S.results,rosters:S.rosters,secs:S.secs}),'application/json'),

};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&ACT[el.dataset.a]){e.preventDefault();ACT[el.dataset.a](el,e);}});
document.addEventListener('click',e=>{const t=e.target.closest('#nav button');if(t)go(t.dataset.tab);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ed){if(t.type==='checkbox')ED[t.dataset.ed]=t.checked;else if(t.dataset.ed==='n'){ED.n=Math.max(1,Math.min(100,+t.value||1));}else if(t.dataset.ed!=='paste')ED[t.dataset.ed]=t.value;}
  else if(t.dataset.sc&&t.dataset.sc!=='examId'){SCAN[t.dataset.sc]=t.value;}
  else if(t.dataset.rv==='find'){RV.find=t.value;RV.focusFind=true;whoPaint();}
  else if(t.dataset.rv){RV[t.dataset.rv]=t.value;}
  else if(t.id==='rvName'){RV.name=t.value;rvBtn();}
  else if(t.dataset.rd){const m=t.closest('.modal'),r=m._r;r[t.dataset.rd]=t.value;stamp(r);save();}
  else if(t.dataset.set==='clientId'){S.set.clientId=t.value.trim();save(false);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ed==='multi'){ED.multi=t.checked;if(!ED.multi)ED.key=ED.key.map(k=>(k||'').slice(0,1));edRedraw();}
  else if(t.dataset.ed==='n'){edResize(+t.value);edRedraw();}
  else if(t.dataset.sc==='examId'){SCAN.examId=t.value;S.set.lastExam=t.value;save(false);scanDefaults(examOf(t.value));render();}
  else if(t.dataset.sc==='secId'){SCAN.secId=t.value;S.set.lastSec=t.value;save(false);render();}
  else if(t.dataset.sn){secSnChange(t);}
  else if(t.dataset.sc){render();}
  else if(t.dataset.rv==='grade'||t.dataset.rv==='section'){const c=$('#rvChips');if(c)c.innerHTML=nameChips();const dl=$('#nameList');if(dl)dl.innerHTML=rosterNames(RV.grade,RV.section).map(n=>`<option value="${esc(n)}">`).join('');}
  else if(t.dataset.res){if(t.dataset.res==='exam'){UI.resExam=t.value;UI.resSec='';}else if(t.dataset.res==='sec')UI.resSec=t.value;else UI.sort=t.value;render();}
  else if(t.dataset.set&&t.type==='checkbox'){S.set[t.dataset.set]=t.checked;save(false);}
  else if(t.id==='fileCam'||t.id==='fileGal'){const f=[...t.files];t.value='';handleFiles(f);}
  else if(t.id==='fileHub'){const f=t.files[0];t.value='';if(!f)return;f.text().then(txt=>{try{const j=JSON.parse(txt);const cl=hubClean(j.classes||[]);if(!cl.length)throw 0;hubPick(cl,'from backup file');}catch(x){toast('That does not look like a Classroom Hub backup',3400);}});}
  else if(t.id==='fileBak'){const f=t.files[0];t.value='';if(!f)return;f.text().then(async txt=>{try{const j=JSON.parse(txt);if(!j.exams)throw 0;const a=await ask('Restore backup?','This <b>merges</b> the backup into what is on this device (newer edits win).',[{t:'Cancel',v:0},{t:'Restore',v:1,cls:'pri'}]);if(!a)return;mergeRemote(j);save();render();toast('Backup restored ✓');}catch(x){toast('That file is not a Scanora backup');}});}
});
function rvBtn(){const R=RV;if(!R)return;const c=rvCounts(),b=$('#rvSave');if(!b)return;
  const can=R.mode==='practice'?true:(c.need===0&&(c.blanks===0||R.blankAck)&&true);b.disabled=!can;
  b.textContent=R.mode==='practice'?'Done':R.mode==='key'?'Use as answer key':(c.need?`Check ${c.need} item${c.need>1?'s':''} first`:c.blanks&&!R.blankAck?'Confirm blanks first':'Save & next ✓');}
